name: Repository inactivity guard

# GitHub can disable scheduled workflows after a long period with no repository
# activity. Only a real repository change resets that clock. Workflow runs and
# issue activity do not. This guard warns 15 days before the documented 60-day
# boundary so Alex can review the repo and make an intentional commit if needed.
#
# The old version committed and pushed a marker automatically. That bypassed
# the repository's explicit approval gate for pushes. This version can only
# open, update, or close an operational issue. It never changes repository
# content and has no contents:write permission.

on:
  schedule:
    - cron: '0 12 * * 1' # every Monday, 12:00 UTC -- arbitrary, just weekly
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  warn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # need real history to check commit dates, not just the tip

      - name: Warn if no real commit landed in the last 45 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RECENT=$(git log -1 --since="45 days ago" --format=%H 2>/dev/null)
          SEARCH_PHRASE="Alpha repository inactivity needs review"
          OPEN_ISSUE=$(gh issue list --repo "${GITHUB_REPOSITORY}" \
            --search "\"${SEARCH_PHRASE}\" in:title" --state open \
            --json number --jq '.[0].number // empty')

          if [ -n "${RECENT}" ]; then
            echo "OK: a real commit landed within the last 45 days (${RECENT:0:8}) -- nothing to do."
            if [ -n "${OPEN_ISSUE}" ]; then
              gh issue comment "${OPEN_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
                --body "Resolved: repository activity resumed at commit ${RECENT:0:8}. Closing this warning."
              gh issue close "${OPEN_ISSUE}" --repo "${GITHUB_REPOSITORY}"
            fi
            exit 0
          fi

          echo "WARNING: no commits in 45+ days. Scheduled workflows may be disabled after 60 days of inactivity."
          BODY="Alpha has had no repository commit in at least 45 days. GitHub may disable daily-send.yml, letter-watchdog.yml, and the database backup after 60 days of inactivity. Review scheduled runs now. If the repo should stay quiet, make one intentional reviewed commit before day 60. This guard will never push a commit for you. Checked ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          if [ -n "${OPEN_ISSUE}" ]; then
            gh issue comment "${OPEN_ISSUE}" --repo "${GITHUB_REPOSITORY}" --body "${BODY}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" \
              --title "${SEARCH_PHRASE}" --body "${BODY}"
          fi
