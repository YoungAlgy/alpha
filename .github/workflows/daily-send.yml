name: Daily letter send

# The actual daily digest generation + delivery, moved OFF Cloudflare Workers
# and onto GitHub Actions. Added 2026-08-05 after a real incident: this
# account is on the Cloudflare Workers FREE plan, which enforces a small,
# non-configurable CPU time limit -- Cloudflare's own deploy API rejects
# `limits.cpu_ms` outright on this plan (only available on a paid Workers
# plan, ~$5/mo). The daily send's per-subscriber generation loop (Claude/
# Gemini/Groq/DeepSeek calls, Brave/You.com search, JSON parsing) blew that
# limit on its very first real Cloudflare-hosted run: 0 errors in Cloudflare's
# own metrics, 0 issues created for any of the 4 active subscribers -- a
# CPU-time-exceeded kill is a silent hard isolate termination, invisible to
# both the app's own error handling and Cloudflare's dashboard.
#
# Algy's call: fix this WITHOUT paying for a Workers plan upgrade. This is
# that fix. GitHub Actions runners have no CPU-time throttling anywhere close
# to that tight (generous minutes on the free tier, already used here for the
# watchdog), so the batch job moves here entirely. The WEBSITE stays on
# Cloudflare -- individual page/API requests are lightweight and have been
# working fine there all along; only the heavy daily generation job needed
# to move.
#
# How it works: builds and starts a REAL, complete Next.js production server
# (`next build && next start`) using the exact same, already-reviewed
# app/api/cron/weekly-send/route.ts, then calls that route over HTTP exactly
# the way Cloudflare's scheduled() handler used to. Zero logic duplication --
# this is the identical code path, just executed somewhere with room to
# actually run it.
#
# wrangler.jsonc's Cloudflare Cron Trigger was REMOVED 2026-08-05. It was
# originally left armed on the theory that it'd be harmless redundancy, but
# that turned out to be net-negative in practice: it raced this GitHub
# Actions job at the identical instant daily, burning free-tier API quota
# before losing the delivered_at claim and getting silently CPU-killed
# anyway. This GitHub Actions schedule is now the sole trigger.

on:
  schedule:
    - cron: '0 14 * * *' # primary send
    # Offset retry, added 2026-08-05 as part of a full resilience audit that
    # specifically verified this is safe: route.ts's delivered_at atomic
    # compare-and-swap (a second caller updates 0 rows and skips), the
    # prefetch already-delivered check, and Resend's own per-(user,day,kind)
    # idempotency key give three independent layers against a duplicate
    # send, and priorIssueCount ("Issue N") is computed per-user so a
    # partial first run doesn't miscount either group. A transient npm
    # registry blip, a dropped/delayed GitHub schedule event (GitHub does
    # not guarantee on-time delivery), or a momentary Supabase/Resend hiccup
    # at 14:00 UTC currently means a full missed day with no second attempt
    # -- this recovers it automatically, same day, without Algy clicking
    # anything. The 15:00 UTC retry is past the primary slot, and the shared
    # concurrency group queues it if that run is still finishing. It is also
    # a full hour before letter-watchdog.yml's 16:00 UTC check, so a
    # successful retry is reflected before the watchdog samples state
    # instead of the watchdog alerting on pre-retry data. It is nowhere near
    # the 00:00 UTC boundary where lib/cadence.ts's currentPeriodIso()
    # would roll over to a new day's weekOf and silently generate a SECOND
    # real letter instead of recovering the missed one.
    - cron: '0 15 * * *'
    # Second offset retry, added 2026-08-06 after a real GitHub Actions
    # platform-wide outage (githubstatus.com incident starting 15:22 UTC,
    # "job was not acquired by Runner of type hosted even after multiple
    # attempts") took out BOTH the 14:00 primary and the 15:00 retry above
    # on the same day -- confirming a single offset retry isn't always
    # enough. Recovered that day via a manual local run (build + `next
    # start` + curl the same route directly, bypassing GitHub Actions
    # entirely); this is the automated version of that same idea, three
    # hours further out, giving a longer-than-usual GitHub-side incident
    # more room to clear before requiring a human.
    #
    # 18:00 UTC specifically: (a) well past 16:00 UTC, so this is
    # deliberately AFTER letter-watchdog.yml's check -- an alert may
    # already have fired by the time this recovers things, which is fine
    # (early signal beats no signal; see letter-watchdog.yml's own header
    # for why it can't reliably self-heal-and-suppress mid-day), (b) still
    # a comfortable 6 hours before the 00:00 UTC weekOf rollover, and (c)
    # far enough past the 15:00 UTC retry that the shared concurrency group
    # normally has time to drain before this last same-day attempt.
    #
    # This does NOT make alpha immune to a GitHub-wide outage -- the 2026-
    # 08-06 incident lasted from 15:22 UTC to past midnight, well beyond
    # even this retry's slot, and no number of same-platform retries can
    # survive an outage that outlasts all of them. What it buys is coverage
    # for the much more common case: a shorter (sub-4-hour) GitHub Actions
    # degradation, which two retries already weren't guaranteed to clear
    # but three comfortably should. A genuinely platform-independent dead-
    # man's-switch (e.g. an external cron/uptime service pinging a
    # heartbeat and alerting Algy directly if the daily send never
    # completes) is the only way to close the remaining gap -- flagged to
    # Algy, not built here, since it requires him to create that account.
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Prevents a manual workflow_dispatch from overlapping a scheduled run (or,
# in principle, any two of the three schedules overlapping if GitHub ever
# delivers one late enough to collide with another). Without this, two
# concurrent full generation passes would both pay real Anthropic/Gemini/Groq/DeepSeek/Brave
# costs for the same undelivered subscribers before the delivered_at CAS
# picks a winner, and their two Resend calls sharing one idempotency key
# would race into a 409. cancel-in-progress: false -- queue behind the
# in-flight run rather than kill it; a send that's already claimed rows
# and started sending should finish, not be torn down mid-send.
concurrency:
  group: alpha-daily-send
  cancel-in-progress: false

jobs:
  send:
    # Manual-first release. Scheduled events remain inert until the first
    # three protected issues are accepted in a separate reviewed release.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # Preserve headroom around the bounded 55-minute delivery loop and final
    # 120-second process drain, including slow checkout/install/build days.
    timeout-minutes: 90
    steps:
      # Skips the expensive checkout/npm ci/build/start below when today's
      # send is already fully covered -- mainly matters for the 15:00 and
      # 18:00 UTC offset retries: on the common day the 14:00 primary
      # already delivered to everyone, a retry used to pay for a full
      # install+build+server boot just to hit the route and find zero
      # undelivered subscribers.
      # Added 2026-08-05, deliberately AFTER first declining to (see
      # alpha_full_app_review_2026-08-05.md in Claude's memory) -- this
      # pipeline's idempotency/timing invariants are carefully reasoned
      # about elsewhere in this file, so this pre-check is written to fail
      # SAFE: any uncertainty (curl error, malformed response, zero active
      # subscribers) means "proceed with the full pipeline", never "skip".
      # Skipping is purely a cost optimization; it must never be able to
      # cause a missed send.
      #
      # Bypassed entirely for workflow_dispatch (github.event_name check
      # below) so an operator-triggered run always executes the full path.
      #
      # Reuses letter-watchdog.yml's watchdog_delivery_check() RPC for send
      # coverage. Nonletter maintenance has its own disabled workflow.
      #
      # 2026-08-05: rewritten from an aggregate-count comparison
      # (delivered_count >= active_count) to a genuine per-subscriber
      # coverage check (uncovered_count) after a post-ship review caught a
      # real gap -- two independent totals can coincidentally match even
      # when one SPECIFIC active subscriber has no letter (e.g. someone
      # unsubscribes the same window someone else signs up), which would
      # have skipped the retry and silently never sent that subscriber
      # anything (tomorrow's cron uses a new week_of, so it's not "late",
      # it's permanently missed). See the RPC's own migration
      # (20260805150000) for the full scenario.
      - name: Pre-check — skip if today's send is already fully covered
        id: precheck
        if: github.event_name == 'schedule'
        env:
          SUPABASE_URL: ${{ secrets.SEND_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SEND_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set +e
          # This step runs before checkout, so keep the exact Alpha project
          # guard inline. Never send either key to a merely non-empty URL.
          if ! SUPABASE_URL_TO_CHECK="${SUPABASE_URL}" node -e "
            try {
              const u = new URL(process.env.SUPABASE_URL_TO_CHECK || '');
              if (u.protocol !== 'https:' ||
                  u.hostname !== 'xpqxhdciaoicsnyyfshy.supabase.co' ||
                  u.port || u.username || u.password ||
                  !['', '/'].includes(u.pathname) || u.search || u.hash) process.exit(1);
            } catch { process.exit(1); }
          "; then
            echo "::error::SEND_SUPABASE_URL does not match Alpha's dedicated project. Value withheld."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Start of today UTC, not "N hours ago" (the watchdog's own
          # cutoff) -- this specifically wants "has TODAY's send finished",
          # not a rolling window.
          CUTOFF=$(date -u +%Y-%m-%dT00:00:00Z)

          RESPONSE=$(curl -sS --max-time 15 --connect-timeout 5 -X POST \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"cutoff\": \"${CUTOFF}\"}" \
            "${SUPABASE_URL}/rest/v1/rpc/watchdog_delivery_check")
          CURL_EXIT=$?
          echo "Pre-check RPC curl exit: ${CURL_EXIT}. Response body withheld."

          if [ "${CURL_EXIT}" -ne 0 ]; then
            UNCOVERED_COUNT=-1
            ACTIVE_COUNT=-1
          else
            COUNTS=$(RESPONSE="${RESPONSE}" node -e "
              const raw = process.env.RESPONSE || '';
              let uncovered = -1, active = -1;
              try {
                const data = JSON.parse(raw);
                if (Array.isArray(data) && data.length === 1 &&
                    typeof data[0].uncovered_count === 'number' &&
                    typeof data[0].active_subscriber_count === 'number') {
                  if (Number.isSafeInteger(data[0].uncovered_count) && data[0].uncovered_count >= 0 &&
                      Number.isSafeInteger(data[0].active_subscriber_count) && data[0].active_subscriber_count >= 0) {
                    uncovered = data[0].uncovered_count;
                    active = data[0].active_subscriber_count;
                  }
                }
              } catch {}
              console.log(uncovered + ' ' + active);
            ")
            UNCOVERED_COUNT=$(echo "${COUNTS}" | cut -d' ' -f1)
            ACTIVE_COUNT=$(echo "${COUNTS}" | cut -d' ' -f2)
            [ -n "${UNCOVERED_COUNT}" ] || UNCOVERED_COUNT=-1
            [ -n "${ACTIVE_COUNT}" ] || ACTIVE_COUNT=-1
          fi
          echo "uncovered=${UNCOVERED_COUNT} active=${ACTIVE_COUNT}"

          # Only skip on confident delivery coverage. Uncertain RPC output and
          # zero active subscribers proceed through the normal pipeline.
          if [ "${ACTIVE_COUNT}" -gt 0 ] && [ "${UNCOVERED_COUNT}" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "SKIP: 0/${ACTIVE_COUNT} active subscribers uncovered today -- nothing to retry."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "PROCEED: ${UNCOVERED_COUNT} uncovered of ${ACTIVE_COUNT} active (or uncertain) -- running the full pipeline."
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.precheck.outputs.skip != 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.precheck.outputs.skip != 'true'
        with:
          node-version: '22'
          cache: 'npm'

      - name: Pre-flight — every required secret present + Resend actually deliverable
        id: preflight
        if: steps.precheck.outputs.skip != 'true'
        env:
          CRON_SECRET: ${{ secrets.SEND_CRON_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.SEND_ANTHROPIC_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.SEND_BRAVE_SEARCH_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.SEND_GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.SEND_GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.SEND_DEEPSEEK_API_KEY }}
          YOU_API_KEY: ${{ secrets.SEND_YOU_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SEND_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SEND_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SEND_SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.SEND_RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.SEND_RESEND_FROM }}
          UNSUBSCRIBE_SECRET: ${{ secrets.SEND_UNSUBSCRIBE_SECRET }}
          ALPHA_OPS_ALERT_WEBHOOK_URL: ${{ secrets.SEND_ALPHA_OPS_ALERT_WEBHOOK_URL }}
          ALPHA_NO_MODEL_MODE: '1'
          ALPHA_ALLOW_PAID_AI: '0'
          ALPHA_PUBLIC_FEED_FALLBACK: ${{ vars.SEND_ALPHA_PUBLIC_FEED_FALLBACK }}
        # Deliberately runs BEFORE `npm ci` -- no dependencies needed (just
        # Node's built-in fetch), so missing values fail immediately and the
        # live Resend check is capped at 15 seconds. Added
        # 2026-08-05 after two real same-day incidents this would have caught
        # instantly: UNSUBSCRIBE_SECRET missing entirely (every subscriber
        # failed only after generating real content for all 4), and a broken
        # Resend key + an unverified sender domain (real AI generation costs
        # spent locally before anyone noticed delivery was impossible).
        run: node scripts/verify-send-preflight.mjs

      - name: Install dependencies
        if: steps.precheck.outputs.skip != 'true'
        run: npm ci

      - name: Verify build-time env vars before spending time on a build
        if: steps.precheck.outputs.skip != 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SEND_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SEND_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/verify-build-env.mjs

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.precheck.outputs.skip != 'true'
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build (plain Next.js -- NOT the Cloudflare/OpenNext bundle, just a runnable server)
        if: steps.precheck.outputs.skip != 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SEND_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SEND_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: https://alpha.everyday.report
          NEXT_PUBLIC_ALPHA_RELEASE_SHA: ${{ github.sha }}
        run: npm run build

      - name: Start the server and run the real daily send
        if: steps.precheck.outputs.skip != 'true'
        env:
          CRON_SECRET: ${{ secrets.SEND_CRON_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.SEND_ANTHROPIC_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.SEND_BRAVE_SEARCH_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.SEND_GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.SEND_GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.SEND_DEEPSEEK_API_KEY }}
          YOU_API_KEY: ${{ secrets.SEND_YOU_API_KEY }}
          JINA_API_KEY: ${{ secrets.SEND_JINA_API_KEY }}
          # Runtime controls live in GitHub variables because this server is
          # separate from the Cloudflare Worker and cannot read its settings.
          ALPHA_DISABLE_DEEPREAD: ${{ vars.SEND_ALPHA_DISABLE_DEEPREAD }}
          ALPHA_BLURB_MODEL: ${{ vars.SEND_ALPHA_BLURB_MODEL }}
          ALPHA_BLURB_CHEAP_MODEL: ${{ vars.SEND_ALPHA_BLURB_CHEAP_MODEL }}
          ALPHA_EDITOR_MODEL: ${{ vars.SEND_ALPHA_EDITOR_MODEL }}
          ALPHA_GEMINI_TEXT_MODEL: ${{ vars.SEND_ALPHA_GEMINI_TEXT_MODEL }}
          ALPHA_GEMINI_SEARCH_MODEL: ${{ vars.SEND_ALPHA_GEMINI_SEARCH_MODEL }}
          # Manual-first delivery keeps paid writer calls off in source.
          ALPHA_ALLOW_PAID_AI: '0'
          # Skip writer-model calls, including per-reader editor notes, and
          # format the current resolved sources locally.
          ALPHA_NO_MODEL_MODE: '1'
          ALPHA_PUBLIC_FEED_FALLBACK: ${{ vars.SEND_ALPHA_PUBLIC_FEED_FALLBACK }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SEND_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SEND_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SEND_SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.SEND_RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.SEND_RESEND_FROM }}
          UNSUBSCRIBE_SECRET: ${{ secrets.SEND_UNSUBSCRIBE_SECRET }}
          # route.ts's sendOpsAlert() falls back to this when Resend itself
          # is the thing that's broken (see lib/email.ts's comment on
          # sendOpsAlertViaWebhook). Live since 2026-08-05 -- posts to a
          # Alpha-only internal alert channel. Never reuse another product's
          # webhook here.
          ALPHA_OPS_ALERT_WEBHOOK_URL: ${{ secrets.SEND_ALPHA_OPS_ALERT_WEBHOOK_URL }}
          NEXT_PUBLIC_APP_URL: https://alpha.everyday.report
        run: |
          set -uo pipefail
          set +e

          # server.log can contain subscriber-entered topic text, model output,
          # provider response bodies, UUIDs, emails, and billing identifiers.
          # A denylist cannot prove all of those shapes were removed. Keep the
          # raw file private to this runner and build the GitHub-visible file
          # from a fixed allowlist of labels and numeric counts only. No source
          # log line is ever copied, printed, or uploaded.
          umask 077
          RAW_SERVER_LOG="server.log"
          PUBLIC_SERVER_LOG="server.public.log"
          PUBLIC_SERVER_LOG_TMP="${PUBLIC_SERVER_LOG}.tmp"

          append_public_count() {
            key="$1"
            needle="$2"
            count=$(LC_ALL=C grep -F -c -- "${needle}" "${RAW_SERVER_LOG}" 2>/dev/null)
            case "${count}" in
              ''|*[!0-9]*) count=0 ;;
            esac
            printf '%s=%s\n' "${key}" "${count}" >> "${PUBLIC_SERVER_LOG_TMP}"
          }

          build_public_server_log() {
            if ! : > "${PUBLIC_SERVER_LOG_TMP}"; then
              : > "${PUBLIC_SERVER_LOG}"
              echo "::warning::Could not create public server diagnostics."
              return 1
            fi

            printf '%s\n' \
              'format=alpha-public-server-diagnostics-v1' \
              'content=fixed-labels-and-numeric-counts-only' \
              >> "${PUBLIC_SERVER_LOG_TMP}"

            if [ -f "${RAW_SERVER_LOG}" ]; then
              raw_line_count=$(wc -l < "${RAW_SERVER_LOG}" 2>/dev/null | tr -d '[:space:]')
              case "${raw_line_count}" in
                ''|*[!0-9]*) raw_line_count=0 ;;
              esac
              printf '%s=%s\n' 'raw_log_present' '1' >> "${PUBLIC_SERVER_LOG_TMP}"
              printf '%s=%s\n' 'raw_line_count' "${raw_line_count}" >> "${PUBLIC_SERVER_LOG_TMP}"

              # Every output key is fixed here and every derived value is a
              # validated integer. grep matches are counted but never emitted.
              append_public_count 'events.next_ready' 'Ready in'
              append_public_count 'events.next_start_failed' 'Failed to start server'
              append_public_count 'events.address_in_use' 'EADDRINUSE'
              append_public_count 'events.out_of_memory' 'heap out of memory'
              append_public_count 'events.module_missing' 'MODULE_NOT_FOUND'
              append_public_count 'events.unhandled_rejection' 'unhandledRejection'
              append_public_count 'events.unauthorized' '[cron/weekly-send] unauthorized request'
              append_public_count 'events.subscriber_fetch_failed' '[cron/weekly-send] subscriber fetch failed:'
              append_public_count 'events.subscriber_failed' '[cron/weekly-send] FAILED:'
              append_public_count 'events.sent_live' '[cron/weekly-send] sent ('
              append_public_count 'events.sent_backup_shared' '[cron/weekly-send] sent BACKUP-SHARED'
              append_public_count 'events.sent_backup_fresh' '[cron/weekly-send] sent BACKUP-FRESH'
              append_public_count 'events.sent_backup_stale' '[cron/weekly-send] sent BACKUP-STALE'
              append_public_count 'events.skipped_already_delivered' '[cron/weekly-send] skipped (already delivered this period)'
              append_public_count 'events.skipped_unsubscribed' '[cron/weekly-send] skipped (unsubscribed mid-run)'
              append_public_count 'events.skipped_access_ended' '[cron/weekly-send] skipped (access ended mid-run)'
              append_public_count 'events.skipped_suppressed' '[cron/weekly-send] skipped (bounced/complained mid-run)'
              append_public_count 'events.skipped_suppression_pending' '[cron/weekly-send] skipped (provider suppression cleanup pending)'
              append_public_count 'events.deferred' '[cron/weekly-send] DEFERRED (time budget exhausted)'
              append_public_count 'events.eligibility_recheck_failed' '[cron/weekly-send] eligibility re-check could not prove access'
              append_public_count 'events.retry_shape_mismatch' '[cron/weekly-send] persisted retry content failed shape validation'
            else
              printf '%s=%s\n' 'raw_log_present' '0' >> "${PUBLIC_SERVER_LOG_TMP}"
              printf '%s=%s\n' 'raw_line_count' '0' >> "${PUBLIC_SERVER_LOG_TMP}"
            fi

            if ! mv -- "${PUBLIC_SERVER_LOG_TMP}" "${PUBLIC_SERVER_LOG}"; then
              : > "${PUBLIC_SERVER_LOG}"
              echo "::warning::Could not publish public server diagnostics."
              return 1
            fi
            echo "Public server diagnostics refreshed."
          }
          alpha_exit_cleanup() {
            if declare -F stop_alpha_server >/dev/null 2>&1 && { [ -n "${SERVER_PID:-}" ] || [ -n "${SERVER_PGID:-}" ]; }; then
              stop_alpha_server 5 || true
            fi
            build_public_server_log
          }
          trap alpha_exit_cleanup EXIT

          : > "${RAW_SERVER_LOG}"
          : > "${PUBLIC_SERVER_LOG}"
          SERVER_PID=''
          SERVER_PGID=''
          WORKFLOW_SHELL_PGID=$(ps -o pgid= -p "$$" 2>/dev/null | tr -d '[:space:]')
          case "${WORKFLOW_SHELL_PGID}" in
            ''|*[!0-9]*)
              echo "::error::Could not identify the workflow shell process group."
              exit 1
              ;;
          esac

          stop_alpha_server() {
            GRACE_SECONDS="${1:-15}"
            STOP_KILLER_PID=''
            if [ -n "${SERVER_PGID}" ]; then
              case "${SERVER_PGID}" in
                ''|*[!0-9]*)
                  echo "::error::Refusing to signal a malformed Alpha server process group."
                  return 1
                  ;;
              esac
              if [ "${SERVER_PGID}" = "${WORKFLOW_SHELL_PGID}" ]; then
                echo "::error::Refusing to signal the workflow shell process group."
                return 1
              fi
              kill -TERM -- "-${SERVER_PGID}" 2>/dev/null
              ( sleep "${GRACE_SECONDS}" && kill -KILL -- "-${SERVER_PGID}" 2>/dev/null ) &
              STOP_KILLER_PID=$!
            elif [ -n "${SERVER_PID}" ]; then
              kill -TERM "${SERVER_PID}" 2>/dev/null
              ( sleep "${GRACE_SECONDS}" && kill -KILL "${SERVER_PID}" 2>/dev/null ) &
              STOP_KILLER_PID=$!
            fi

            if [ -n "${SERVER_PID}" ]; then
              wait "${SERVER_PID}" 2>/dev/null
            fi
            if [ -n "${STOP_KILLER_PID}" ]; then
              kill "${STOP_KILLER_PID}" 2>/dev/null
              wait "${STOP_KILLER_PID}" 2>/dev/null
            fi
            if [ -n "${SERVER_PGID}" ]; then
              for i in $(seq 1 10); do
                if ! kill -0 -- "-${SERVER_PGID}" 2>/dev/null; then
                  break
                fi
                sleep 1
              done
              if kill -0 -- "-${SERVER_PGID}" 2>/dev/null; then
                kill -KILL -- "-${SERVER_PGID}" 2>/dev/null
                sleep 1
                if kill -0 -- "-${SERVER_PGID}" 2>/dev/null; then
                  echo "::error::Alpha server process group did not stop."
                  return 1
                fi
              fi
            fi

            SERVER_PID=''
            SERVER_PGID=''
            if curl -sS --max-time 3 "http://localhost:3100/api/health" >/dev/null 2>&1; then
              echo "::error::Port 3100 still responds after the Alpha server group stopped."
              return 1
            fi
            return 0
          }

          start_alpha_server() {
            if ! command -v setsid >/dev/null 2>&1; then
              echo "::error::setsid is required for isolated Alpha server lifecycle control."
              return 1
            fi
            if curl -sS --max-time 3 "http://localhost:3100/api/health" >/dev/null 2>&1; then
              echo "::error::Port 3100 already has a responding server before launch."
              return 1
            fi

            setsid node ./node_modules/next/dist/bin/next start -p 3100 >> "${RAW_SERVER_LOG}" 2>&1 &
            SERVER_PID=$!
            case "${SERVER_PID}" in
              ''|*[!0-9]*)
                echo "::error::Could not capture the Alpha server process id."
                SERVER_PID=''
                return 1
                ;;
            esac
            SERVER_PGID=''
            for i in $(seq 1 20); do
              SERVER_PGID=$(ps -o pgid= -p "${SERVER_PID}" 2>/dev/null | tr -d '[:space:]')
              if [ "${SERVER_PGID}" = "${SERVER_PID}" ]; then
                break
              fi
              if ! kill -0 "${SERVER_PID}" 2>/dev/null; then
                break
              fi
              sleep 0.1
            done
            if [ "${SERVER_PGID}" != "${SERVER_PID}" ]; then
              echo "::error::Could not prove the Alpha server started in its own process group."
              case "${SERVER_PGID}" in
                ''|*[!0-9]*) kill -TERM "${SERVER_PID}" 2>/dev/null ;;
                *)
                  if [ "${SERVER_PGID}" != "${WORKFLOW_SHELL_PGID}" ]; then
                    kill -TERM -- "-${SERVER_PGID}" 2>/dev/null
                  else
                    kill -TERM "${SERVER_PID}" 2>/dev/null
                  fi
                  ;;
              esac
              wait "${SERVER_PID}" 2>/dev/null
              SERVER_PID=''
              SERVER_PGID=''
              return 1
            fi

            echo "Waiting for a fresh Alpha server ..."
            READY=0
            for i in $(seq 1 30); do
              if ! kill -0 "${SERVER_PID}" 2>/dev/null; then
                break
              fi
              if curl -fsS --max-time 3 "http://localhost:3100/api/health" >/dev/null 2>&1; then
                READY=1
                break
              fi
              sleep 2
            done
            if [ "${READY}" -ne 1 ]; then
              build_public_server_log
              echo "::error::Alpha server never became healthy. Public-safe operational summary:"
              tail -n 100 "${PUBLIC_SERVER_LOG}"
              stop_alpha_server 5
              return 1
            fi
            echo "Fresh Alpha server is up."
            return 0
          }

          if ! start_alpha_server; then
            exit 1
          fi

          URL="http://localhost:3100/api/cron/weekly-send"

          DELIVERY_CURL_FAILED=0
          DELIVERY_HTTP_FAILED=0
          DELIVERY_SHAPE_FAILED=0
          DELIVERY_DRAIN_INCOMPLETE=0
          DELIVERY_BLOCKED_PAGE=0
          DELIVERY_CURSOR_FAILED=0
          DELIVERY_UNCOVERED_TOTAL=0
          DELIVERY_RETRY_REQUIRED_TOTAL=0
          DELIVERY_RETENTION_ERRORS=0
          DELIVERY_COST_BRAKE=0
          DELIVERY_PAGE_COUNT=0
          DELIVERY_TAIL_DRAINED=0
          DELIVERY_MODE="normal"
          DELIVERY_AFTER_USER_ID=""
          DELIVERY_LAST_CONTINUATION=""
          DELIVERY_INITIAL_CURSOR_PRESENT=0
          DELIVERY_SAW_WRAP=0
          DELIVERY_WRAP_PROBE_USED=0
          MAX_DELIVERY_PAGES=16
          DELIVERY_DRAIN_SECONDS=3300
          MIN_DELIVERY_PAGE_SECONDS=300
          DELIVERY_DRAIN_STARTED=$(date +%s)
          RESPONSE=''
          # Preflight exits nonzero before npm ci when delivery is not ready.
            while true; do
              if [ "${DELIVERY_PAGE_COUNT}" -ge "${MAX_DELIVERY_PAGES}" ]; then
                DELIVERY_DRAIN_INCOMPLETE=1
                echo "::error::Delivery page limit (${MAX_DELIVERY_PAGES}) reached while another page was required."
                break
              fi

              DELIVERY_NOW=$(date +%s)
              DELIVERY_ELAPSED=$((DELIVERY_NOW - DELIVERY_DRAIN_STARTED))
              DELIVERY_REMAINING=$((DELIVERY_DRAIN_SECONDS - DELIVERY_ELAPSED))
              if [ "${DELIVERY_REMAINING}" -lt "${MIN_DELIVERY_PAGE_SECONDS}" ]; then
                DELIVERY_DRAIN_INCOMPLETE=1
                echo "::error::Delivery drain time budget is too low to start another bounded page."
                break
              fi
              PAGE_CURL_TIMEOUT=${DELIVERY_REMAINING}
              if [ "${PAGE_CURL_TIMEOUT}" -gt 1500 ]; then
                PAGE_CURL_TIMEOUT=1500
              fi

              PAGE_URL="${URL}"
              if [ "${DELIVERY_MODE}" = "override" ]; then
                case "${PAGE_URL}" in
                  *\?*) PAGE_URL="${PAGE_URL}&afterUserId=${DELIVERY_AFTER_USER_ID}" ;;
                  *) PAGE_URL="${PAGE_URL}?afterUserId=${DELIVERY_AFTER_USER_ID}" ;;
                esac
              fi

              NEXT_PAGE_NUMBER=$((DELIVERY_PAGE_COUNT + 1))
              echo "Calling bounded delivery page ${NEXT_PAGE_NUMBER}/${MAX_DELIVERY_PAGES} (${DELIVERY_MODE} mode) ..."
              # -w appends the HTTP status as the last line. The raw response
              # stays private to the runner because it can contain emails.
              RAW=$(curl -sS --max-time "${PAGE_CURL_TIMEOUT}" -H "Authorization: Bearer ${CRON_SECRET}" -w '\n%{http_code}' "${PAGE_URL}")
              PAGE_CURL_EXIT=$?
              PAGE_HTTP_STATUS=$(echo "${RAW}" | tail -n 1)
              RESPONSE=$(echo "${RAW}" | sed '$d')
              echo "Delivery page ${NEXT_PAGE_NUMBER} response (curl exit ${PAGE_CURL_EXIT}, HTTP ${PAGE_HTTP_STATUS}):"
              echo "${RESPONSE}" | node -e "let d=''; process.stdin.on('data',c=>d+=c).on('end',()=>{try{const s=JSON.parse(d); for(const k of ['backupSharedSentEmails','backupFreshSentEmails','backupStaleSentEmails','skippedBlankSubscribers','deferred','failures']){if(k in s)s[k]=Array.isArray(s[k])?s[k].length:0} for(const k of ['deliveryCursor','deliveryCursorNext','deliveryPageLastUserId']){if(s[k])s[k]='[redacted]'} console.log(JSON.stringify(s,null,2))}catch(e){console.log('[response body redacted: invalid JSON]')}})"

              if [ "${PAGE_CURL_EXIT}" -ne 0 ]; then
                DELIVERY_CURL_FAILED=1
                DELIVERY_DRAIN_INCOMPLETE=1
                break
              fi
              if [ "${PAGE_HTTP_STATUS}" -lt 200 ] || [ "${PAGE_HTTP_STATUS}" -ge 300 ]; then
                DELIVERY_HTTP_FAILED=1
                DELIVERY_DRAIN_INCOMPLETE=1
                break
              fi

              PAGE_STATE=$(echo "${RESPONSE}" | node -e "
                let d=''; process.stdin.on('data',c=>d+=c).on('end',()=>{
                  try {
                    const s=JSON.parse(d);
                    const uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
                    const integer=v=>Number.isInteger(v)&&v>=0;
                    const cursorStates=new Set(['advanced','advanced_with_retry','override_read_only','empty','advance_failed']);
                    const cursorOrNull=v=>v===null||uuid.test(v);
                    if (!integer(s.subscribers) || !integer(s.sent) ||
                        !integer(s.backupSharedSent) || !integer(s.backupFreshSent) || !integer(s.backupStaleSent) ||
                        !integer(s.skippedAlreadyDelivered) || !integer(s.unsubscribedMidRunSkips) ||
                        !integer(s.cancelledMidRunSkips) || !integer(s.suppressedMidRunSkips) ||
                        !integer(s.checkoutRetentionErrors) || !integer(s.deliveryPageCount) ||
                        !integer(s.deliveryRetryRequiredTotal) || s.deliveryBatchSize!==250 ||
                        typeof s.deliveryPageComplete!=='boolean' || typeof s.deliveryRetryRequired!=='boolean' ||
                        typeof s.deliveryPageBlocked!=='boolean' || typeof s.deliveryHasMore!=='boolean' ||
                        typeof s.deliveryWrapped!=='boolean' || typeof s.deliveryCursorAdvanceFailed!=='boolean' ||
                        !cursorStates.has(s.deliveryCursorState) || !cursorOrNull(s.deliveryCursor) ||
                        !cursorOrNull(s.deliveryCursorNext) || !cursorOrNull(s.deliveryPageLastUserId) ||
                        typeof s.paidCallBudgetDate!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(s.paidCallBudgetDate) ||
                        typeof s.paidCallCeilingHit!=='boolean' ||
                        !integer(s.paidCallReservationsGranted) || !integer(s.paidCallReservationsUsed) ||
                        !integer(s.paidCallReservationsUnused) || typeof s.paidCallReservationExhausted!=='boolean' ||
                        !(s.paidCallReservationError===null||typeof s.paidCallReservationError==='string')) throw new Error('shape');
                    if (s.deliveryPageCount!==s.subscribers || s.deliveryPageCount>s.deliveryBatchSize ||
                        s.deliveryPageComplete===s.deliveryRetryRequired ||
                        s.deliveryRetryRequired!==(s.deliveryRetryRequiredTotal>0) ||
                        s.deliveryPageBlocked!==(s.deliveryRetryRequired||s.deliveryCursorAdvanceFailed) ||
                        s.deliveryCursorAdvanceFailed!==(s.deliveryCursorState==='advance_failed') ||
                        (s.deliveryPageCount===0)!==(s.deliveryPageLastUserId===null) ||
                        (s.deliveryHasMore&&(s.deliveryPageCount!==s.deliveryBatchSize||s.deliveryPageLastUserId===null)) ||
                        (s.deliveryCursorState==='advanced'&&(s.deliveryPageBlocked||s.deliveryCursorNext!==s.deliveryPageLastUserId)) ||
                        (s.deliveryCursorState==='advanced_with_retry'&&(!s.deliveryRetryRequired||s.deliveryCursorAdvanceFailed||s.deliveryCursorNext!==s.deliveryPageLastUserId)) ||
                        (s.deliveryCursorState==='empty'&&(s.deliveryPageCount!==0||s.deliveryPageBlocked)) ||
                        (s.deliveryCursorState==='override_read_only'&&s.deliveryCursorNext!==s.deliveryCursor)) throw new Error('contract');
                    const covered=s.sent+s.backupSharedSent+s.backupFreshSent+s.backupStaleSent;
                    const excused=s.skippedAlreadyDelivered+s.unsubscribedMidRunSkips+s.cancelledMidRunSkips+s.suppressedMidRunSkips;
                    const uncovered=Math.max(s.subscribers-covered-excused,0);
                    if (uncovered!==s.deliveryRetryRequiredTotal) throw new Error('coverage');
                    process.stdout.write([
                      'OK', uncovered, s.deliveryHasMore?1:0, s.deliveryRetryRequiredTotal,
                      s.deliveryPageLastUserId||'NONE', s.deliveryPageBlocked?1:0,
                      s.deliveryCursorAdvanceFailed?1:0, s.checkoutRetentionErrors,
                      (s.paidCallCeilingHit||s.paidCallReservationError)?1:0,
                      s.deliveryCursorState, s.deliveryWrapped?1:0, s.deliveryCursor?1:0
                    ].join('|'));
                  } catch { process.stdout.write('SHAPE_INVALID'); }
                });
              ")

              if [ "${PAGE_STATE}" = "SHAPE_INVALID" ]; then
                DELIVERY_SHAPE_FAILED=1
                DELIVERY_DRAIN_INCOMPLETE=1
                break
              fi

              IFS='|' read -r PAGE_OK PAGE_UNCOVERED PAGE_HAS_MORE PAGE_RETRY_TOTAL PAGE_LAST_USER_ID PAGE_BLOCKED PAGE_CURSOR_FAILED PAGE_RETENTION_ERRORS PAGE_COST_BRAKE PAGE_CURSOR_STATE PAGE_WRAPPED PAGE_CURSOR_PRESENT <<< "${PAGE_STATE}"
              if [ "${PAGE_OK}" != "OK" ]; then
                DELIVERY_SHAPE_FAILED=1
                DELIVERY_DRAIN_INCOMPLETE=1
                break
              fi

              DELIVERY_PAGE_COUNT=$((DELIVERY_PAGE_COUNT + 1))
              DELIVERY_UNCOVERED_TOTAL=$((DELIVERY_UNCOVERED_TOTAL + PAGE_UNCOVERED))
              DELIVERY_RETRY_REQUIRED_TOTAL=$((DELIVERY_RETRY_REQUIRED_TOTAL + PAGE_RETRY_TOTAL))
              DELIVERY_RETENTION_ERRORS=$((DELIVERY_RETENTION_ERRORS + PAGE_RETENTION_ERRORS))
              if [ "${PAGE_BLOCKED}" -eq 1 ]; then DELIVERY_BLOCKED_PAGE=1; fi
              if [ "${PAGE_CURSOR_FAILED}" -eq 1 ]; then DELIVERY_CURSOR_FAILED=1; fi
              if [ "${PAGE_COST_BRAKE}" -eq 1 ]; then DELIVERY_COST_BRAKE=1; fi
              if [ "${PAGE_WRAPPED}" -eq 1 ]; then DELIVERY_SAW_WRAP=1; fi
              if [ "${DELIVERY_PAGE_COUNT}" -eq 1 ]; then DELIVERY_INITIAL_CURSOR_PRESENT=${PAGE_CURSOR_PRESENT}; fi

              # A cursor conflict is the only page result that cannot claim
              # durable scan progress. Continue later rows read-only, then fail
              # red after the final drain. Retry-required rows on a successful CAS
              # use advanced_with_retry and stay in normal round-robin flow.
              if [ "${PAGE_CURSOR_FAILED}" -eq 1 ]; then
                if [ "${PAGE_HAS_MORE}" -eq 1 ]; then
                  if [ "${PAGE_LAST_USER_ID}" = "NONE" ] || [ "${PAGE_LAST_USER_ID}" = "${DELIVERY_LAST_CONTINUATION}" ]; then
                    DELIVERY_DRAIN_INCOMPLETE=1
                    echo "::error::Cursor-conflicted delivery page did not provide a new safe continuation."
                    break
                  fi
                  DELIVERY_MODE="override"
                  DELIVERY_AFTER_USER_ID="${PAGE_LAST_USER_ID}"
                  DELIVERY_LAST_CONTINUATION="${PAGE_LAST_USER_ID}"
                  continue
                fi
                DELIVERY_TAIL_DRAINED=1
                break
              fi

              if [ "${DELIVERY_MODE}" = "override" ]; then
                if [ "${PAGE_HAS_MORE}" -eq 1 ]; then
                  if [ "${PAGE_LAST_USER_ID}" = "NONE" ] || [ "${PAGE_LAST_USER_ID}" = "${DELIVERY_LAST_CONTINUATION}" ]; then
                    DELIVERY_DRAIN_INCOMPLETE=1
                    echo "::error::Delivery continuation made no progress."
                    break
                  fi
                  DELIVERY_AFTER_USER_ID="${PAGE_LAST_USER_ID}"
                  DELIVERY_LAST_CONTINUATION="${PAGE_LAST_USER_ID}"
                  continue
                fi
                DELIVERY_TAIL_DRAINED=1
                break
              fi

              if [ "${PAGE_CURSOR_STATE}" != "advanced" ] && [ "${PAGE_CURSOR_STATE}" != "advanced_with_retry" ] && [ "${PAGE_CURSOR_STATE}" != "empty" ]; then
                DELIVERY_SHAPE_FAILED=1
                DELIVERY_DRAIN_INCOMPLETE=1
                echo "::error::Normal delivery page returned an invalid cursor state."
                break
              fi
              if [ "${PAGE_HAS_MORE}" -eq 1 ]; then
                continue
              fi

              # A run that began behind a prior cursor drains the UUID tail,
              # then makes one normal probe so the route can wrap to the head.
              # DELIVERY_SAW_WRAP prevents a second cycle.
              if [ "${DELIVERY_INITIAL_CURSOR_PRESENT}" -eq 1 ] && [ "${DELIVERY_SAW_WRAP}" -eq 0 ] && [ "${DELIVERY_WRAP_PROBE_USED}" -eq 0 ]; then
                DELIVERY_WRAP_PROBE_USED=1
                continue
              fi

              DELIVERY_TAIL_DRAINED=1
              break
            done

            if [ "${DELIVERY_TAIL_DRAINED}" -ne 1 ] && [ "${DELIVERY_DRAIN_INCOMPLETE}" -ne 1 ]; then
              DELIVERY_DRAIN_INCOMPLETE=1
            fi
            echo "Delivery drain summary: pages=${DELIVERY_PAGE_COUNT}, retry_required=${DELIVERY_RETRY_REQUIRED_TOTAL}, uncovered=${DELIVERY_UNCOVERED_TOTAL}, tail_drained=${DELIVERY_TAIL_DRAINED}."
          # Weekly send can return while a self-bounded Next after() delivery
          # tail is still settling. Drain the server before this job exits.
          echo "Draining the send server ..."
          if ! stop_alpha_server 120; then
            echo "::error::Could not prove the delivery server stopped."
            exit 1
          fi

            if [ "${DELIVERY_CURL_FAILED}" -ne 0 ]; then
              build_public_server_log
              echo "::error::A bounded delivery page curl failed. See the public-safe operational summary below."
              tail -n 200 "${PUBLIC_SERVER_LOG}"
              exit 1
            fi
            if [ "${DELIVERY_HTTP_FAILED}" -ne 0 ]; then
              echo "::error::A bounded delivery page returned a non-2xx status."
              exit 1
            fi
            if [ "${DELIVERY_SHAPE_FAILED}" -ne 0 ]; then
              echo "::error::A delivery response violated the page/cursor contract. It was not treated as a silent success."
              exit 1
            fi
            if [ "${DELIVERY_RETENTION_ERRORS}" -ne 0 ]; then
              echo "::error::Database-only pre-send retention failed ${DELIVERY_RETENTION_ERRORS} time(s) across the delivery pages."
              exit 1
            fi
            if [ "${DELIVERY_COST_BRAKE}" -ne 0 ]; then
              echo "::error::The shared paid-call ceiling or its durable reservation failed."
              exit 1
            fi
            if [ "${DELIVERY_CURSOR_FAILED}" -ne 0 ]; then
              echo "::error::A delivery cursor compare-and-swap failed. Later pages were attempted read-only, and durable progress was not claimed."
              exit 1
            fi
            if [ "${DELIVERY_DRAIN_INCOMPLETE}" -ne 0 ] || [ "${DELIVERY_TAIL_DRAINED}" -ne 1 ]; then
              echo "::error::Delivery stopped at the page or wall-clock bound while ordered work remained. The next slot will resume from durable state."
              exit 1
            fi
            if [ "${DELIVERY_BLOCKED_PAGE}" -ne 0 ] || [ "${DELIVERY_RETRY_REQUIRED_TOTAL}" -ne 0 ] || [ "${DELIVERY_UNCOVERED_TOTAL}" -ne 0 ]; then
              echo "::error::${DELIVERY_RETRY_REQUIRED_TOTAL} retry-required page outcome(s) were observed across ${DELIVERY_PAGE_COUNT} page(s). The fair scan cursor advanced, and uncovered readers stay eligible for wraparound retry."
              exit 1
            fi

          echo "OK: send completed and every active subscriber accounted for."

      - name: Upload public-safe server diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-server-diagnostics
          path: server.public.log
          retention-days: 7
