name: Daily letter send

# The actual daily digest generation + delivery, moved OFF Cloudflare Workers
# and onto GitHub Actions. Added 2026-08-05 after a real incident: this
# account is on the Cloudflare Workers FREE plan, which enforces a small,
# non-configurable CPU time limit -- Cloudflare's own deploy API rejects
# `limits.cpu_ms` outright on this plan (only available on a paid Workers
# plan, ~$5/mo). The daily send's per-subscriber generation loop (Claude/
# Gemini/Groq/DeepSeek calls, Brave/You.com search, JSON parsing) blew that
# limit on its very first real Cloudflare-hosted run: 0 errors in Cloudflare's
# own metrics, 0 issues created for any of the 4 active subscribers -- a
# CPU-time-exceeded kill is a silent hard isolate termination, invisible to
# both the app's own error handling and Cloudflare's dashboard.
#
# Algy's call: fix this WITHOUT paying for a Workers plan upgrade. This is
# that fix. GitHub Actions runners have no CPU-time throttling anywhere close
# to that tight (generous minutes on the free tier, already used here for the
# watchdog), so the batch job moves here entirely. The WEBSITE stays on
# Cloudflare -- individual page/API requests are lightweight and have been
# working fine there all along; only the heavy daily generation job needed
# to move.
#
# How it works: builds and starts a REAL, complete Next.js production server
# (`next build && next start`) using the exact same, already-reviewed
# app/api/cron/weekly-send/route.ts, then calls that route over HTTP exactly
# the way Cloudflare's scheduled() handler used to. Zero logic duplication --
# this is the identical code path, just executed somewhere with room to
# actually run it.
#
# Deliberately NOT disabling wrangler.jsonc's Cloudflare Cron Trigger. The
# route's own delivered_at compare-and-swap makes a duplicate/overlapping
# invocation safe by design (exactly one caller ever wins the claim for a
# given subscriber+day) -- so leaving Cloudflare's cron armed costs nothing
# and is free, harmless redundancy: if it ever DOES succeed (e.g. the
# subscriber list changes in a way that fits under the Free plan's limit),
# that's a bonus, not a conflict.

on:
  schedule:
    - cron: '0 14 * * *' # primary send
    # Offset retry, added 2026-08-05 as part of a full resilience audit that
    # specifically verified this is safe: route.ts's delivered_at atomic
    # compare-and-swap (a second caller updates 0 rows and skips), the
    # prefetch already-delivered check, and Resend's own per-(user,day,kind)
    # idempotency key give three independent layers against a duplicate
    # send, and priorIssueCount ("Issue N") is computed per-user so a
    # partial first run doesn't miscount either group. A transient npm
    # registry blip, a dropped/delayed GitHub schedule event (GitHub does
    # not guarantee on-time delivery), or a momentary Supabase/Resend hiccup
    # at 14:00 UTC currently means a full missed day with no second attempt
    # -- this recovers it automatically, same day, without Algy clicking
    # anything. 15:00 UTC specifically: (a) comfortably past the primary's
    # 30-minute job timeout so the two runs cannot overlap in practice, (b)
    # a full hour before letter-watchdog.yml's 16:00 UTC check, so a
    # successful retry is reflected before the watchdog samples state
    # instead of the watchdog alerting on pre-retry data, and (c) nowhere
    # near the 00:00 UTC boundary where lib/cadence.ts's currentPeriodIso()
    # would roll over to a new day's weekOf and silently generate a SECOND
    # real letter instead of recovering the missed one. Do not schedule any
    # retry slot at or after 16:00 UTC without also moving the watchdog.
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      weekOf:
        description: 'Optional YYYY-MM-DD override (admin backfill/testing only -- leave blank for the normal daily run)'
        required: false
        type: string

permissions:
  contents: read

# Prevents a manual workflow_dispatch from overlapping a scheduled run (or,
# in principle, the two schedules overlapping if GitHub ever delivers one
# late enough to collide with the other). Without this, two concurrent full
# generation passes would both pay real Anthropic/Gemini/Groq/DeepSeek/Brave
# costs for the same undelivered subscribers before the delivered_at CAS
# picks a winner, and their two Resend calls sharing one idempotency key
# would race into a 409. cancel-in-progress: false -- queue behind the
# in-flight run rather than kill it; a send that's already claimed rows
# and started sending should finish, not be torn down mid-send.
concurrency:
  group: alpha-daily-send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Pre-flight — every required secret present + Resend actually deliverable
        env:
          CRON_SECRET: ${{ secrets.SEND_CRON_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.SEND_ANTHROPIC_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.SEND_BRAVE_SEARCH_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.SEND_GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.SEND_GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.SEND_DEEPSEEK_API_KEY }}
          YOU_API_KEY: ${{ secrets.SEND_YOU_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SEND_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SEND_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SEND_SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.SEND_RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.SEND_RESEND_FROM }}
          UNSUBSCRIBE_SECRET: ${{ secrets.SEND_UNSUBSCRIBE_SECRET }}
        # Deliberately runs BEFORE `npm ci` -- no dependencies needed (just
        # Node's built-in fetch), so a missing/broken secret fails in under a
        # second instead of after a full install+build+generation run. Added
        # 2026-08-05 after two real same-day incidents this would have caught
        # instantly: UNSUBSCRIBE_SECRET missing entirely (every subscriber
        # failed only after generating real content for all 4), and a broken
        # Resend key + an unverified sender domain (real AI generation costs
        # spent locally before anyone noticed delivery was impossible).
        run: node scripts/verify-send-preflight.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify build-time env vars before spending time on a build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SEND_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SEND_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/verify-build-env.mjs

      - name: Build (plain Next.js -- NOT the Cloudflare/OpenNext bundle, just a runnable server)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SEND_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SEND_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: https://alpha.everyday.report
        run: npm run build

      - name: Start the server and run the real daily send
        env:
          CRON_SECRET: ${{ secrets.SEND_CRON_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.SEND_ANTHROPIC_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.SEND_BRAVE_SEARCH_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.SEND_GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.SEND_GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.SEND_DEEPSEEK_API_KEY }}
          YOU_API_KEY: ${{ secrets.SEND_YOU_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SEND_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SEND_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SEND_SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.SEND_RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.SEND_RESEND_FROM }}
          UNSUBSCRIBE_SECRET: ${{ secrets.SEND_UNSUBSCRIBE_SECRET }}
          # Optional -- route.ts's sendOpsAlert() falls back to this when
          # Resend itself is the thing that's broken (see lib/email.ts's
          # comment on sendOpsAlertViaWebhook). Unset until Algy creates a
          # Discord/Slack webhook; behaves identically to before until then.
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.SEND_OPS_ALERT_WEBHOOK_URL }}
          NEXT_PUBLIC_APP_URL: https://alpha.everyday.report
          WEEK_OF_INPUT: ${{ inputs.weekOf }}
        run: |
          set -uo pipefail
          set +e

          npm run start -- -p 3100 > server.log 2>&1 &
          SERVER_PID=$!

          echo "Waiting for the server to come up..."
          READY=0
          for i in $(seq 1 30); do
            if curl -sS --max-time 3 "http://localhost:3100/api/health" >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "${READY}" -ne 1 ]; then
            echo "::error::Server never became healthy. Last 100 lines of server.log:"
            tail -n 100 server.log
            kill "${SERVER_PID}" 2>/dev/null
            exit 1
          fi
          echo "Server is up."

          URL="http://localhost:3100/api/cron/weekly-send"
          if [ -n "${WEEK_OF_INPUT}" ]; then
            URL="${URL}?weekOf=${WEEK_OF_INPUT}"
            echo "Manual weekOf override: ${WEEK_OF_INPUT}"
          fi

          echo "Calling ${URL} ..."
          # -w appends the HTTP status as the LAST line of output, separated
          # from the body so it can't collide with real JSON content.
          RAW=$(curl -sS --max-time 1500 -H "Authorization: Bearer ${CRON_SECRET}" -w '\n%{http_code}' "${URL}")
          CURL_EXIT=$?
          HTTP_STATUS=$(echo "${RAW}" | tail -n 1)
          RESPONSE=$(echo "${RAW}" | sed '$d')
          echo "Response (curl exit ${CURL_EXIT}, HTTP ${HTTP_STATUS}):"
          echo "${RESPONSE}" | node -e "let d=''; process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.stringify(JSON.parse(d),null,2))}catch(e){console.log(d)}})"

          # Drain, don't kill -- an abrupt SIGKILL/SIGTERM the instant curl
          # returns can cut off Next's after() background work (route.ts's
          # persist+send tail can legitimately still be running for the LAST
          # subscriber processed). `wait` after TERM gives it a moment to
          # finish; found live 2026-08-05 as part of the same-day resilience
          # audit -- a subscriber whose delivered_at was just claimed but
          # whose send hadn't been confirmed yet would otherwise read as
          # delivered to every future check with no email ever having gone
          # out, and nothing anywhere would notice.
          kill -TERM "${SERVER_PID}" 2>/dev/null
          ( sleep 10 && kill -KILL "${SERVER_PID}" 2>/dev/null ) &
          KILLER_PID=$!
          wait "${SERVER_PID}" 2>/dev/null
          kill "${KILLER_PID}" 2>/dev/null

          if [ "${CURL_EXIT}" -ne 0 ]; then
            echo "::error::curl itself failed (exit ${CURL_EXIT}) -- see server.log below."
            tail -n 200 server.log
            exit 1
          fi

          # HTTP status FIRST, independent of body shape. Found live
          # 2026-08-05: a 401 (e.g. a drifted CRON_SECRET) returns valid JSON
          # ({"error":"Unauthorized"}), which the old missed-count parser
          # below scored as 0 missed -- a wrong secret produced a green job
          # that delivered nothing to anyone.
          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "::error::Route returned HTTP ${HTTP_STATUS}, not 2xx -- see the response body above. Nothing was necessarily delivered."
            exit 1
          fi

          # Validate the response actually has the expected shape AND assert
          # real coverage, not just "failed is small". A body that parses as
          # JSON but isn't the real summary (an unexpected error shape, an
          # empty object) used to read as "0 missed" by accident -- this now
          # requires `subscribers` and `sent` to both be real numbers before
          # trusting anything else in the payload, and separately asserts
          # every non-skipped subscriber was actually covered by sent or one
          # of the three backup tiers, not merely that `failed` looks small.
          COVERAGE=$(echo "${RESPONSE}" | node -e "
            let d=''; process.stdin.on('data',c=>d+=c).on('end',()=>{
              try {
                const s = JSON.parse(d);
                if (typeof s.subscribers !== 'number' || typeof s.sent !== 'number') {
                  process.stdout.write('SHAPE_INVALID');
                  return;
                }
                const covered = (s.sent||0) + (s.backupSharedSent||0) + (s.backupFreshSent||0) + (s.backupStaleSent||0);
                const excused = (s.skippedBlankSubscribers ? s.skippedBlankSubscribers.length : 0) + (s.skippedAlreadyDelivered||0);
                const uncovered = s.subscribers - excused - covered;
                const deferredCount = s.deferred ? s.deferred.length : 0;
                process.stdout.write(String(Math.max(uncovered, deferredCount, 0)));
              } catch (e) { process.stdout.write('SHAPE_INVALID'); }
            });
          ")

          if [ "${COVERAGE}" = "SHAPE_INVALID" ]; then
            echo "::error::Response body was HTTP 2xx but not the expected send-summary JSON shape -- treating as a failure, not a silent pass."
            exit 1
          fi

          if [ "${COVERAGE}" != "0" ]; then
            echo "::error::${COVERAGE} subscriber(s) not accounted for by sent/backup/excused counts (or deferred for time) this run."
            exit 1
          fi

          echo "OK: send completed, every active subscriber accounted for."

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
          retention-days: 7
