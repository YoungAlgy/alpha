name: Daily letter watchdog

# Independent dead-man's-switch for the daily digest send. Added 2026-08-05
# after a real 5-day outage: a Vercel->Cloudflare migration silently left
# the Cron Trigger unwired, so the app itself stayed healthy (deployed,
# reachable, /api/health green) while zero letters sent for 5 days with no
# error anywhere -- nothing noticed until Algy did. See
# alpha_cloudflare_cron_outage_2026-08-05 in Claude's memory for the full
# incident.
#
# Deliberately NOT hosted on Cloudflare/Vercel: whatever platform runs
# alpha's actual send, this runs somewhere else entirely, so a repeat of
# THAT exact failure mode (a migration/config change silently disabling the
# cron on the app's own host) can't also disable this. It reads Supabase
# directly -- the one source of truth a broken host can't fake -- rather
# than trusting the app's own /api/health for the delivery check (that
# endpoint only proves the app is reachable and configured, not that
# today's send actually happened -- it stayed green the whole 5-day
# outage). /api/health IS used below, but only for the second job, to check
# something it's actually authoritative about: which of its own API keys
# are configured.
#
# Runs 2 hours after the app's own 14:00 UTC cron, giving it time to
# actually finish sending to every subscriber before checking.
#
# Reviewed and hardened 2026-08-05 (same day) after an adversarial
# multi-agent pass found real gaps in the first version:
# - CUTOFF had no explicit UTC marker on its timestamp string, relying on
#   Supabase's project timezone happening to be UTC rather than saying so.
# - `set -euo pipefail` combined with an unguarded curl/jq meant a hard
#   failure (Supabase unreachable, or an HTML error page jq can't parse)
#   aborted the whole script BEFORE the Resend/GitHub-Issue alerts ran --
#   exactly the failure mode most likely to correlate with something being
#   genuinely wrong, and it was the one case that silently lost 2 of the 3
#   alert channels.
# - The delivery check was a bare `limit=1` existence check: one delivered
#   row and 399 silently un-sent subscribers both read as "OK". A hard
#   crash partway through the per-subscriber send loop (Worker CPU/wall-
#   clock limit, an unhandled exception) would never reach the app's own
#   internal ops-alert either, since that only fires after the full loop
#   finishes. Now compares delivered count against active subscriber count.
# - Nothing anywhere checked whether the OTHER half of this exact incident
#   (3 resilience-tier secrets that never migrated off the old host) could
#   recur -- the app's own /api/health route already computes
#   checks.groq/deepseek/you/gemini/brave, it just never gated anything and
#   nothing ever read it. Added a second job that does.
#
# Second hardening pass, same day, after a fresh independent review of the
# FIRST pass's own fixes (not just the original bugs):
# - The partial-send threshold used integer division (ACTIVE_COUNT / 2),
#   which truncates -- at alpha's actual small subscriber count this made
#   the detector literally unreachable (no DELIVERED_COUNT value could ever
#   trip it) at ACTIVE_COUNT in {1,2,3}, and let an exact 50% loss slip
#   through even at ACTIVE_COUNT=4. Rewritten as an exact integer
#   comparison (DELIVERED_COUNT*2 <= ACTIVE_COUNT) with no truncation.
# - The DELIVERED_COUNT==0 branch alerted unconditionally, with no check
#   for ACTIVE_COUNT also being 0 -- if the subscriber base ever
#   legitimately hits zero, this would've alerted forever with nothing
#   actually wrong. Now treated as OK.
# - None of the curl calls set a timeout, so a stalled connection (TCP
#   accepted, response never completes) could hang the job for hours
#   instead of failing fast into the alert path. All curls now bound.
# - The Resend calls didn't check their own exit code -- ironic given this
#   file's whole point is not silently swallowing failures. Now logged
#   (not hard-failed, since the GitHub Issue channel is the durable one).

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch: {} # manual run button in the Actions tab, for testing

permissions:
  issues: write # for gh issue create/comment/close below

jobs:
  check-delivery:
    runs-on: ubuntu-latest
    steps:
      - name: Check Supabase for real, complete delivery in the last 20 hours
        env:
          SUPABASE_URL: ${{ secrets.WATCHDOG_SUPABASE_URL }}
          # Public anon/publishable key, NOT the full-privilege secret key --
          # see the watchdog_delivery_check() migration (2026-08-05) for why.
          # This key being in a GitHub secret is just hygiene/rotation-ease,
          # not real protection -- it's the same key already compiled into
          # the app's own client-side bundles, so a leak here isn't a
          # meaningful new exposure the way the old secret key was.
          SUPABASE_KEY: ${{ secrets.WATCHDOG_SUPABASE_ANON_KEY }}
          RESEND_API_KEY: ${{ secrets.WATCHDOG_RESEND_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Deliberately NOT `set -e`: curl/jq failures are handled
          # explicitly below and routed to the alert path, not allowed to
          # silently abort the script -- see header comment.

          close_issue_if_open() {
            local search_phrase="$1" resolution_note="$2" open_issue
            open_issue=$(gh issue list --repo "${GITHUB_REPOSITORY}" --search "\"${search_phrase}\" in:title" --state open --json number --jq '.[0].number // empty')
            if [ -n "${open_issue}" ]; then
              gh issue comment "${open_issue}" --repo "${GITHUB_REPOSITORY}" --body "${resolution_note}"
              gh issue close "${open_issue}" --repo "${GITHUB_REPOSITORY}"
            fi
          }

          open_or_update_issue() {
            local search_phrase="$1" issue_title="$2" body="$3" open_issue
            open_issue=$(gh issue list --repo "${GITHUB_REPOSITORY}" --search "\"${search_phrase}\" in:title" --state open --json number --jq '.[0].number // empty')
            if [ -n "${open_issue}" ]; then
              gh issue comment "${open_issue}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
            else
              gh issue create --repo "${GITHUB_REPOSITORY}" --title "${issue_title}" --body "${body}"
            fi
          }

          send_resend_alert() {
            local subject="$1" body="$2" payload resend_exit
            payload=$(jq -n --arg from "alpha watchdog <alpha@avahealth.co>" --arg to "youngalgy@gmail.com" \
              --arg subject "${subject}" --arg text "${body}" \
              '{from: $from, to: [$to], subject: $subject, text: $text}')
            curl -sS -f --max-time 15 --connect-timeout 5 -X POST 'https://api.resend.com/emails' \
              -H "Authorization: Bearer ${RESEND_API_KEY}" \
              -H 'Content-Type: application/json' \
              -d "${payload}" >/dev/null
            resend_exit=$?
            # Best-effort: log, don't fail the job over this alone -- the
            # GitHub Issue channel (open_or_update_issue) is the durable one
            # and doesn't depend on Resend at all.
            [ "${resend_exit}" -eq 0 ] || echo "WARNING: Resend alert call failed (curl exit ${resend_exit}) -- the GitHub Issue channel is still the source of truth."
          }

          # 20h, not 24h: the check runs ~2h after the expected 14:00 UTC
          # send, so a genuinely missed day's send always falls outside this
          # window by the time the NEXT day's check runs, while still
          # comfortably covering a send that ran a bit late. Explicit `Z`
          # suffix -- without it this string carries no timezone marker and
          # Postgres would resolve it against the session's `timezone` GUC
          # rather than an inherent UTC assumption; matches how the app's
          # own write path stamps delivered_at (`new Date().toISOString()`).
          CUTOFF=$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)

          # Real counts, not a limit=1 existence check -- a limit=1 check
          # can't tell "everyone got their letter" from "one subscriber got
          # a letter and the run died 30 seconds later." Both counts come
          # from ONE call to watchdog_delivery_check() (see the 2026-08-05
          # migration) instead of two raw table queries -- that RPC is
          # security definer and returns only these two integers, callable
          # with the anon key, so this never touches raw rows/PII and never
          # needs the full-privilege secret key the first version of this
          # workflow used.
          RESPONSE=$(curl -sS --max-time 15 --connect-timeout 5 -X POST \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"cutoff\": \"${CUTOFF}\"}" \
            "${SUPABASE_URL}/rest/v1/rpc/watchdog_delivery_check")
          CURL_EXIT=$?
          echo "Supabase RPC response (curl exit ${CURL_EXIT}): ${RESPONSE}"

          # Node instead of jq for this one -- the expected shape is a
          # single-element array of an object with two int fields, which is
          # easy to get subtly wrong in jq and impossible to test locally
          # (jq isn't installed anywhere on this machine). A curl-level
          # failure, a non-JSON body, or a response that doesn't match the
          # expected shape (a Supabase error object, an RLS/grant issue)
          # all fall through to -1 for both counts, which routes to the
          # alert path below, not a silent pass.
          if [ "${CURL_EXIT}" -ne 0 ]; then
            DELIVERED_COUNT=-1
            ACTIVE_COUNT=-1
          else
            COUNTS=$(RESPONSE="${RESPONSE}" node -e "
              const raw = process.env.RESPONSE || '';
              let delivered = -1, active = -1;
              try {
                const data = JSON.parse(raw);
                if (Array.isArray(data) && data.length === 1 &&
                    typeof data[0].delivered_count === 'number' &&
                    typeof data[0].active_subscriber_count === 'number') {
                  delivered = data[0].delivered_count;
                  active = data[0].active_subscriber_count;
                }
              } catch (e) {}
              process.stdout.write(delivered + ' ' + active);
            ")
            DELIVERED_COUNT=$(echo "${COUNTS}" | cut -d' ' -f1)
            ACTIVE_COUNT=$(echo "${COUNTS}" | cut -d' ' -f2)
            [ -n "${DELIVERED_COUNT}" ] || DELIVERED_COUNT=-1
            [ -n "${ACTIVE_COUNT}" ] || ACTIVE_COUNT=-1
          fi
          echo "Active subscriber count: ${ACTIVE_COUNT}"

          SEARCH_PHRASE="Daily letter send may be broken"
          ISSUE_TITLE="🚨 ${SEARCH_PHRASE}"
          PARTIAL_SEARCH_PHRASE="Daily letter send may be incomplete"
          PARTIAL_ISSUE_TITLE="⚠️ ${PARTIAL_SEARCH_PHRASE}"

          if [ "${DELIVERED_COUNT}" -lt 0 ]; then
            echo "ALERT: could not verify delivery (Supabase unreachable or returned something unparseable) -- treating as a failed check, not a silent pass."
            ALERT_BODY="The daily digest watchdog could not verify delivery: the Supabase query itself failed or returned an unparseable/non-array response (curl exit ${CURL_EXIT}) as of $(date -u +%Y-%m-%dT%H:%M:%SZ). This could mean Supabase is down, credentials rotated, or something else -- but it could also mean the send is broken and this check just can't see it either way. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            send_resend_alert "[alpha] Watchdog could not verify today's delivery" "${ALERT_BODY}"
            open_or_update_issue "${SEARCH_PHRASE}" "${ISSUE_TITLE}" "${ALERT_BODY}"
            exit 1
          fi

          if [ "${DELIVERED_COUNT}" -eq 0 ]; then
            # ACTIVE_COUNT==0 alongside DELIVERED_COUNT==0 means there was
            # legitimately no one to send to (not "the send is broken") --
            # without this, a subscriber base that ever hits zero would
            # alert forever with nothing actually wrong.
            if [ "${ACTIVE_COUNT}" -eq 0 ]; then
              echo "OK: zero active subscribers right now, so zero deliveries is expected."
              close_issue_if_open "${SEARCH_PHRASE}" "Resolved: zero active subscribers as of $(date -u +%Y-%m-%dT%H:%M:%SZ), so zero deliveries is expected, not a broken send. Closing automatically."
              close_issue_if_open "${PARTIAL_SEARCH_PHRASE}" "Resolved: zero active subscribers as of $(date -u +%Y-%m-%dT%H:%M:%SZ). Closing automatically."
              exit 0
            fi
            echo "ALERT: no delivered issues found since ${CUTOFF} -- the daily send may be broken."
            ALERT_BODY="The daily digest watchdog found no issues.delivered_at since ${CUTOFF} against ${ACTIVE_COUNT} active subscribers (checked $(date -u +%Y-%m-%dT%H:%M:%SZ)). The app may be up and healthy while the actual send is broken -- this is exactly the failure mode from the 2026-08-05 outage (cron trigger silently unwired after a host migration). Check: is the Cloudflare Cron Trigger still armed (wrangler.jsonc triggers.crons), are all required secrets still present on whatever host is live, and did the last deploy actually go out. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            send_resend_alert "[alpha] No letters delivered in the last 20 hours" "${ALERT_BODY}"
            open_or_update_issue "${SEARCH_PHRASE}" "${ISSUE_TITLE}" "${ALERT_BODY}"
            close_issue_if_open "${PARTIAL_SEARCH_PHRASE}" "Superseded: the full send now appears to have failed outright (0 delivered), not just partially. See the linked broken-send issue instead."
            exit 1
          fi

          # Full failure would already have been caught above (DELIVERED_COUNT
          # would be 0). This catches the OTHER half of a crash mid-send: some
          # subscribers got their letter and the run died before finishing the
          # rest -- something a bare existence check can't distinguish from a
          # clean run, and something the app's own internal ops-alert also
          # can't catch (it only fires after the full per-subscriber loop
          # completes, so a hard kill mid-loop skips it too). Only judged when
          # ACTIVE_COUNT itself was verified (>0); an unverifiable active
          # count isn't treated as evidence of a partial send.
          #
          # DELIVERED_COUNT*2 <= ACTIVE_COUNT, not DELIVERED_COUNT <
          # ACTIVE_COUNT/2 -- bash integer division truncates ACTIVE_COUNT/2
          # toward zero, which at alpha's actual small subscriber count made
          # this check unreachable (no DELIVERED_COUNT could ever trip it)
          # for ACTIVE_COUNT in {1,2,3}, and let an exact 50% loss slip
          # through even at ACTIVE_COUNT=4. Multiplying DELIVERED_COUNT by 2
          # instead of dividing ACTIVE_COUNT is an exact integer comparison
          # with no rounding loss, and <= (not <) means an exact half-loss
          # -- itself a real, worth-investigating signal for a "did the send
          # crash mid-loop" detector -- correctly fires instead of being
          # waved through.
          if [ "${ACTIVE_COUNT}" -gt 0 ] && [ $(( DELIVERED_COUNT * 2 )) -le "${ACTIVE_COUNT}" ]; then
            echo "ALERT: only ${DELIVERED_COUNT}/${ACTIVE_COUNT} active subscribers got a letter since ${CUTOFF} -- possible partial/crashed send."
            ALERT_BODY="The daily digest watchdog found only ${DELIVERED_COUNT} delivered issues.delivered_at since ${CUTOFF}, against ${ACTIVE_COUNT} active subscribers (checked $(date -u +%Y-%m-%dT%H:%M:%SZ)). Some letters clearly went out, so this isn't a total outage -- but this looks like a crashed or interrupted send (Worker CPU/wall-clock limit, an unhandled exception mid-loop), which alpha's own internal ops-alert also would not have caught (it only fires after the full per-subscriber loop finishes). Check the Cloudflare Worker's logs for the last cron invocation. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            send_resend_alert "[alpha] Possible partial letter send (${DELIVERED_COUNT}/${ACTIVE_COUNT})" "${ALERT_BODY}"
            open_or_update_issue "${PARTIAL_SEARCH_PHRASE}" "${PARTIAL_ISSUE_TITLE}" "${ALERT_BODY}"
            exit 1
          fi

          echo "OK: ${DELIVERED_COUNT} delivered since ${CUTOFF} (${ACTIVE_COUNT} active subscribers)."
          close_issue_if_open "${SEARCH_PHRASE}" "Resolved: a real, apparently-complete delivery landed since ${CUTOFF} (checked $(date -u +%Y-%m-%dT%H:%M:%SZ)). Closing automatically."
          close_issue_if_open "${PARTIAL_SEARCH_PHRASE}" "Resolved: today's delivery count looks complete (checked $(date -u +%Y-%m-%dT%H:%M:%SZ)). Closing automatically."

  check-resilience-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check /api/health for resilience-tier keys the primary send doesn't need but the fallback chain does
        env:
          RESEND_API_KEY: ${{ secrets.WATCHDOG_RESEND_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          # Same three helpers as the delivery-check job -- duplicated
          # rather than shared because GitHub Actions has no lightweight
          # way to share a bash function across jobs without a separate
          # composite action, and this is the only other place that needs
          # them.
          close_issue_if_open() {
            local search_phrase="$1" resolution_note="$2" open_issue
            open_issue=$(gh issue list --repo "${GITHUB_REPOSITORY}" --search "\"${search_phrase}\" in:title" --state open --json number --jq '.[0].number // empty')
            if [ -n "${open_issue}" ]; then
              gh issue comment "${open_issue}" --repo "${GITHUB_REPOSITORY}" --body "${resolution_note}"
              gh issue close "${open_issue}" --repo "${GITHUB_REPOSITORY}"
            fi
          }

          open_or_update_issue() {
            local search_phrase="$1" issue_title="$2" body="$3" open_issue
            open_issue=$(gh issue list --repo "${GITHUB_REPOSITORY}" --search "\"${search_phrase}\" in:title" --state open --json number --jq '.[0].number // empty')
            if [ -n "${open_issue}" ]; then
              gh issue comment "${open_issue}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
            else
              gh issue create --repo "${GITHUB_REPOSITORY}" --title "${issue_title}" --body "${body}"
            fi
          }

          # Third duplicated helper -- same Resend payload/curl pattern as
          # check-delivery's send_resend_alert(), extracted here too rather
          # than left inline, so both jobs' alert-sending logic lives in the
          # same shape and a future payload change only needs finding via
          # "send_resend_alert" in both places, not one function + one
          # easy-to-miss inline block.
          send_resend_alert() {
            local subject="$1" body="$2" payload resend_exit
            payload=$(jq -n --arg from "alpha watchdog <alpha@avahealth.co>" --arg to "youngalgy@gmail.com" \
              --arg subject "${subject}" --arg text "${body}" \
              '{from: $from, to: [$to], subject: $subject, text: $text}')
            curl -sS -f --max-time 15 --connect-timeout 5 -X POST 'https://api.resend.com/emails' \
              -H "Authorization: Bearer ${RESEND_API_KEY}" \
              -H 'Content-Type: application/json' \
              -d "${payload}" >/dev/null
            resend_exit=$?
            [ "${resend_exit}" -eq 0 ] || echo "WARNING: Resend alert call failed (curl exit ${resend_exit}) -- the GitHub Issue channel is still the source of truth."
          }

          # This is the ONE place in this whole setup where trusting the
          # app's own /api/health is actually correct: it's authoritative
          # about which of its own process.env keys are set, which is
          # exactly what this checks. The delivery-check job deliberately
          # does NOT trust this endpoint for "did a send happen" -- see
          # header comment -- but "is GROQ_API_KEY configured" isn't
          # something Supabase would ever know either way.
          RESPONSE=$(curl -sS --max-time 15 --connect-timeout 5 "https://alpha.everyday.report/api/health")
          CURL_EXIT=$?
          echo "/api/health response (curl exit ${CURL_EXIT}): ${RESPONSE}"

          SEARCH_PHRASE="Resilience-tier API key may be missing on Cloudflare"
          ISSUE_TITLE="⚠️ ${SEARCH_PHRASE}"

          if [ "${CURL_EXIT}" -ne 0 ]; then
            echo "Could not reach /api/health -- not alerting on this job specifically, the delivery-check job already covers total-outage detection."
            exit 0
          fi

          # The exact 3 that went missing in the 2026-08-05 incident, plus
          # the other 2 keys in the same fallback-tier family (gemini,
          # brave) -- all 5 are explicitly non-blocking-for-app-uptime per
          # this route's own comments, which is exactly why nothing else
          # would ever notice one going missing. Node instead of jq here
          # (unlike the delivery-check job) -- this filter is involved
          # enough that a jq syntax slip would be easy to miss and hard to
          # test locally; this exact logic was verified against sample
          # /api/health payloads before shipping.
          MISSING=$(RESPONSE="${RESPONSE}" node -e "
            const raw = process.env.RESPONSE || '';
            let missing = 'unparseable';
            try {
              const data = JSON.parse(raw);
              if (data && typeof data === 'object' && data.checks && typeof data.checks === 'object') {
                const watched = ['groq', 'deepseek', 'you', 'gemini', 'brave'];
                missing = watched.filter((k) => data.checks[k] === false).join(', ');
              }
            } catch (e) {}
            process.stdout.write(missing);
          ")

          if [ "${MISSING}" = "unparseable" ]; then
            echo "Could not parse /api/health's checks object -- not alerting, avoiding a false positive on a response-shape change rather than a real key going missing."
            exit 0
          fi

          if [ -z "${MISSING}" ]; then
            echo "OK: groq/deepseek/you/gemini/brave all configured."
            close_issue_if_open "${SEARCH_PHRASE}" "Resolved: /api/health now reports all resilience-tier keys configured (checked $(date -u +%Y-%m-%dT%H:%M:%SZ)). Closing automatically."
            exit 0
          fi

          echo "ALERT: /api/health reports these resilience-tier keys missing: ${MISSING}"
          ALERT_BODY="alpha's /api/health reports these resilience-tier API keys are NOT configured on the live Cloudflare Worker: ${MISSING} (checked $(date -u +%Y-%m-%dT%H:%M:%SZ)). This is exactly the second half of the 2026-08-05 outage -- the primary send can still succeed via its remaining providers while this stays silently broken, so nothing else here would catch it. Fix: wrangler secret put <NAME> for each key listed, from whatever host currently holds the real value. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          send_resend_alert "[alpha] Resilience-tier key(s) missing: ${MISSING}" "${ALERT_BODY}"
          open_or_update_issue "${SEARCH_PHRASE}" "${ISSUE_TITLE}" "${ALERT_BODY}"
          exit 1
