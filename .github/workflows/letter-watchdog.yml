name: Daily letter watchdog

# Independent dead-man's-switch for the daily digest send. Added 2026-08-05
# after a real 5-day outage: a Vercel->Cloudflare migration silently left
# the Cron Trigger unwired, so the app itself stayed healthy (deployed,
# reachable, /api/health green) while zero letters sent for 5 days with no
# error anywhere -- nothing noticed until Algy did. See
# alpha_cloudflare_cron_outage_2026-08-05 in Claude's memory for the full
# incident.
#
# Deliberately NOT hosted on Cloudflare/Vercel: whatever platform runs
# alpha's actual send, this runs somewhere else entirely, so a repeat of
# THAT exact failure mode (a migration/config change silently disabling the
# cron on the app's own host) can't also disable this. It reads Supabase
# directly -- the one source of truth a broken host can't fake -- rather
# than trusting the app's own /api/health for the delivery check (that
# endpoint only proves the app is reachable and configured, not that
# today's send actually happened -- it stayed green the whole 5-day
# outage). /api/health is used in the first job only to prove the exact
# live release's delivery policy before an intentional pause skips coverage.
#
# Runs 2 hours after the app's own 14:00 UTC cron, giving it time to
# actually finish sending to every subscriber before checking.
#
# Reviewed and hardened 2026-08-05 (same day) after an adversarial
# multi-agent pass found real gaps in the first version:
# - CUTOFF had no explicit UTC marker on its timestamp string, relying on
#   Supabase's project timezone happening to be UTC rather than saying so.
# - `set -euo pipefail` combined with an unguarded curl/jq meant a hard
#   failure (Supabase unreachable, or an HTML error page jq can't parse)
#   aborted the whole script BEFORE the Resend/GitHub-Issue alerts ran --
#   exactly the failure mode most likely to correlate with something being
#   genuinely wrong, and it was the one case that silently lost 2 of the 3
#   alert channels.
# - The delivery check was a bare `limit=1` existence check: one delivered
#   row and 399 silently un-sent subscribers both read as "OK". A hard
#   crash partway through the per-subscriber send loop (Worker CPU/wall-
#   clock limit, an unhandled exception) would never reach the app's own
#   internal ops-alert either, since that only fires after the full loop
#   finishes. Now checks direct per-subscriber uncovered coverage.
# - Nothing anywhere checked whether the OTHER half of this exact incident
#   (3 resilience-tier secrets that never migrated off the old host) could
#   recur -- the app's own /api/health route already computes
#   checks.groq/deepseek/you/gemini/brave, it just never gated anything and
#   nothing ever read it. Added a second job that does.
#
# Later hardening passes kept tightening those checks:
# - The RPC now returns a direct per-subscriber uncovered_count. Any value
#   above zero is an alert. The old partial-send percentage threshold could
#   still report success while a real subscriber remained uncovered.
# - During active delivery, delivery issues close only after uncovered_count
#   reaches zero. A zero active-subscriber day returns zero uncovered. A
#   verified intentional pause can also close a stale delivery-only issue,
#   with a note that closure does not prove historical missed sends recovered.
# - None of the curl calls set a timeout, so a stalled connection (TCP
#   accepted, response never completes) could hang the job for hours
#   instead of failing fast into the alert path. All curls now bound.
# - The Resend calls didn't check their own exit code -- ironic given this
#   file's whole point is not silently swallowing failures. Now logged
#   (not hard-failed, since the GitHub Issue channel is the durable one).

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch: {} # manual run button in the Actions tab, for testing

permissions:
  issues: write # for gh issue create/comment/close below

jobs:
  check-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # only this job reads the checked-out delivery policy
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check Supabase for real, complete delivery in the last 20 hours
        # A failed checkout must still reach the release-state alert path.
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.WATCHDOG_SUPABASE_URL }}
          # Public anon/publishable key, NOT the full-privilege secret key --
          # see the watchdog_delivery_check() migration (2026-08-05) for why.
          # This key being in a GitHub secret is just hygiene/rotation-ease,
          # not real protection -- it's the same key already compiled into
          # the app's own client-side bundles, so a leak here isn't a
          # meaningful new exposure the way the old secret key was.
          SUPABASE_KEY: ${{ secrets.WATCHDOG_SUPABASE_ANON_KEY }}
          RESEND_API_KEY: ${{ secrets.WATCHDOG_RESEND_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Deliberately NOT `set -e`: curl/jq failures are handled
          # explicitly below and routed to the alert path, not allowed to
          # silently abort the script -- see header comment.
          #
          # BUG FOUND LIVE 2026-08-05: that comment describes the INTENDED
          # behavior, but GitHub Actions invokes every `run:` step's script
          # via `bash -e {0}` regardless of what `set` flags the script itself
          # requests -- confirmed via this exact job's own log ("shell:
          # /usr/bin/bash -e {0}"). `set -uo pipefail` only adds -u/pipefail;
          # it does NOT clear an already-active -e. So errexit was ON the
          # whole time despite this comment's claim, and it did exactly what
          # -e does: the first `curl -f` failure (a 401 from send_resend_alert
          # hitting Resend) killed the script immediately, BEFORE
          # open_or_update_issue() -- the channel this file's own header
          # calls "the durable one" -- ever ran. Confirmed live: the delivery
          # check correctly detected 0/4 delivered and printed its ALERT line,
          # then the whole job died with exit 22, and no GitHub Issue was
          # created. This explicit `set +e` is what actually makes the
          # comment's stated intent true -- omitting -e is not the same as
          # disabling it once the parent shell already turned it on.
          set +e

          close_issue_if_open() {
            local search_phrase="$1" resolution_note="$2" open_issue
            open_issue=$(gh issue list --repo "${GITHUB_REPOSITORY}" --search "\"${search_phrase}\" in:title" --state open --json number --jq '.[0].number // empty')
            if [ -n "${open_issue}" ]; then
              gh issue comment "${open_issue}" --repo "${GITHUB_REPOSITORY}" --body "${resolution_note}"
              gh issue close "${open_issue}" --repo "${GITHUB_REPOSITORY}"
            fi
          }

          open_or_update_issue() {
            local search_phrase="$1" issue_title="$2" body="$3" open_issue
            open_issue=$(gh issue list --repo "${GITHUB_REPOSITORY}" --search "\"${search_phrase}\" in:title" --state open --json number --jq '.[0].number // empty')
            if [ -n "${open_issue}" ]; then
              gh issue comment "${open_issue}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
            else
              gh issue create --repo "${GITHUB_REPOSITORY}" --title "${issue_title}" --body "${body}"
            fi
          }

          send_resend_alert() {
            local subject="$1" body="$2" payload resend_exit
            # everyday.report, NOT avahealth.co (fixed live 2026-08-05):
            # the from-domain must be verified under the SAME Resend account
            # as the API key or every send 403s with "domain is not
            # verified" -- confirmed directly against Resend's API. This is
            # the actual, currently-verified domain for this key; using an
            # unrelated business's domain here was the root cause of every
            # watchdog alert email silently failing.
            payload=$(jq -n --arg from "alpha watchdog <alpha@everyday.report>" --arg to "youngalgy@gmail.com" \
              --arg subject "${subject}" --arg text "${body}" \
              '{from: $from, to: [$to], subject: $subject, text: $text}')
            curl -sS -f --max-time 15 --connect-timeout 5 -X POST 'https://api.resend.com/emails' \
              -H "Authorization: Bearer ${RESEND_API_KEY}" \
              -H 'Content-Type: application/json' \
              -d "${payload}" >/dev/null
            resend_exit=$?
            # Best-effort: log, don't fail the job over this alone -- the
            # GitHub Issue channel (open_or_update_issue) is the durable one
            # and doesn't depend on Resend at all.
            [ "${resend_exit}" -eq 0 ] || echo "WARNING: Resend alert call failed (curl exit ${resend_exit}) -- the GitHub Issue channel is still the source of truth."
          }

          # Skip coverage only when the checked-out source policy and the live
          # Worker both prove the SAME exact release is paused. A push ahead of
          # deployment, an old live Worker, a broken health endpoint, or an
          # unrecognized policy is an alert, never permission to skip.
          RELEASE_SEARCH_PHRASE="Daily letter release state unverified"
          RELEASE_ISSUE_TITLE="⚠️ ${RELEASE_SEARCH_PHRASE}"
          HEALTH_FILE="${RUNNER_TEMP}/alpha-watchdog-health.json"
          HEALTH_HTTP_STATUS=$(curl -sS --max-time 15 --connect-timeout 5 --max-filesize 8192 \
            -o "${HEALTH_FILE}" -w '%{http_code}' \
            'https://alpha.everyday.report/api/health')
          HEALTH_CURL_EXIT=$?
          MODE_CHECK_REASON=""
          if [ "${HEALTH_CURL_EXIT}" -ne 0 ]; then
            MODE_CHECK_REASON="live_health_fetch_failed"
          else
            WATCHDOG_CHECKOUT_SHA=$(git rev-parse HEAD 2>/dev/null)
            MODE=$(WATCHDOG_CHECKOUT_SHA="${WATCHDOG_CHECKOUT_SHA}" \
              WATCHDOG_HEALTH_HTTP_STATUS="${HEALTH_HTTP_STATUS}" \
              node scripts/alpha-watchdog-delivery-mode.mjs < "${HEALTH_FILE}")
            MODE_CHECK_EXIT=$?
            if [ "${MODE_CHECK_EXIT}" -ne 0 ]; then
              MODE_CHECK_REASON="source_or_live_health_mismatch"
            fi
          fi
          if [ -n "${MODE_CHECK_REASON}" ]; then
            echo "ALERT: the expected subscriber-delivery state could not be verified (${MODE_CHECK_REASON})."
            ALERT_BODY="The watchdog could not prove that the checked-out source policy and live Alpha health agree on one exact release. Health HTTP status: ${HEALTH_HTTP_STATUS:-unavailable}. No delivery skip was accepted. Check the release SHA, live health, and source policy. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            send_resend_alert "[alpha] Delivery release state unverified" "${ALERT_BODY}"
            open_or_update_issue "${RELEASE_SEARCH_PHRASE}" "${RELEASE_ISSUE_TITLE}" "${ALERT_BODY}"
            exit 1
          fi
          close_issue_if_open "${RELEASE_SEARCH_PHRASE}" "Resolved: live health and the checked-out delivery policy agree on the exact release as of $(date -u +%Y-%m-%dT%H:%M:%SZ)."
          if [ "${MODE}" = "paused" ]; then
            echo "OK: subscriber letters are intentionally paused in the exact live release. Delivery coverage is not expected."
            close_issue_if_open "Daily letter send may be broken" "Closed because the exact live release intentionally pauses subscriber letters. This does not prove historical missed deliveries were recovered."
            close_issue_if_open "Daily letter send may be incomplete" "Closed because the exact live release intentionally pauses subscriber letters. This does not prove historical missed deliveries were recovered."
            exit 0
          fi

          # 20h, not 24h: the check runs ~2h after the expected 14:00 UTC
          # send, so a genuinely missed day's send always falls outside this
          # window by the time the NEXT day's check runs, while still
          # comfortably covering a send that ran a bit late. Explicit `Z`
          # suffix -- without it this string carries no timezone marker and
          # Postgres would resolve it against the session's `timezone` GUC
          # rather than an inherent UTC assumption; matches how the app's
          # own write path stamps delivered_at (`new Date().toISOString()`).
          CUTOFF=$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)

          # Real counts, not a limit=1 existence check -- a limit=1 check
          # can't tell "everyone got their letter" from "one subscriber got
          # a letter and the run died 30 seconds later." Both counts come
          # from ONE call to watchdog_delivery_check() instead of two raw
          # table queries -- that RPC is security definer and returns only
          # these two integers, callable with the anon key, so this never
          # touches raw rows/PII and never needs the full-privilege secret
          # key the first version of this workflow used.
          #
          # 2026-08-05: the RPC itself was rewritten from an aggregate
          # delivered_count to a genuine per-subscriber uncovered_count (see
          # migration 20260805150000) -- a raw row count could stay
          # unchanged while a SPECIFIC active subscriber quietly had no
          # letter (e.g. someone unsubscribes the same window someone else
          # signs up), which is exactly the blind spot a delivery watchdog
          # exists to catch. A covered count below is derived as
          # ACTIVE_COUNT - UNCOVERED_COUNT for alert detail, while the alert
          # decision itself uses UNCOVERED_COUNT directly. One uncovered
          # subscriber is enough to fail the check.
          if ! SUPABASE_URL_TO_CHECK="${SUPABASE_URL}" node -e "
            try {
              const u = new URL(process.env.SUPABASE_URL_TO_CHECK || '');
              if (u.protocol !== 'https:' ||
                  u.hostname !== 'xpqxhdciaoicsnyyfshy.supabase.co' ||
                  u.port || u.username || u.password ||
                  !['', '/'].includes(u.pathname) || u.search || u.hash) process.exit(1);
            } catch { process.exit(1); }
          "; then
            echo "ERROR: WATCHDOG_SUPABASE_URL does not match Alpha's dedicated project. Value withheld."
            RESPONSE=''
            CURL_EXIT=90
          else
            RESPONSE=$(curl -sS --max-time 15 --connect-timeout 5 -X POST \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"cutoff\": \"${CUTOFF}\"}" \
              "${SUPABASE_URL}/rest/v1/rpc/watchdog_delivery_check")
            CURL_EXIT=$?
          fi
          echo "Supabase RPC response (curl exit ${CURL_EXIT}): ${RESPONSE}"

          # Node instead of jq for this one -- the expected shape is a
          # single-element array of an object with two int fields, which is
          # easy to get subtly wrong in jq and impossible to test locally
          # (jq isn't installed anywhere on this machine). A curl-level
          # failure, a non-JSON body, or a response that doesn't match the
          # expected shape (a Supabase error object, an RLS/grant issue)
          # all fall through to -1 for both counts, which routes to the
          # alert path below, not a silent pass.
          if [ "${CURL_EXIT}" -ne 0 ]; then
            UNCOVERED_COUNT=-1
            ACTIVE_COUNT=-1
          else
            COUNTS=$(RESPONSE="${RESPONSE}" node -e "
              const raw = process.env.RESPONSE || '';
              let uncovered = -1, active = -1;
              try {
                const data = JSON.parse(raw);
                if (Array.isArray(data) && data.length === 1 &&
                    typeof data[0].uncovered_count === 'number' &&
                    typeof data[0].active_subscriber_count === 'number') {
                  uncovered = data[0].uncovered_count;
                  active = data[0].active_subscriber_count;
                }
              } catch (e) {}
              process.stdout.write(uncovered + ' ' + active);
            ")
            UNCOVERED_COUNT=$(echo "${COUNTS}" | cut -d' ' -f1)
            ACTIVE_COUNT=$(echo "${COUNTS}" | cut -d' ' -f2)
            [ -n "${UNCOVERED_COUNT}" ] || UNCOVERED_COUNT=-1
            [ -n "${ACTIVE_COUNT}" ] || ACTIVE_COUNT=-1
          fi
          echo "Active subscriber count: ${ACTIVE_COUNT}, uncovered: ${UNCOVERED_COUNT}"

          # Derive the covered count only for alert detail. The pass/fail
          # decision below is based directly on UNCOVERED_COUNT, so even one
          # missed subscriber alerts. Preserve the -1 "couldn't verify"
          # sentinel whenever either input is unverifiable.
          if [ "${UNCOVERED_COUNT}" -lt 0 ] || [ "${ACTIVE_COUNT}" -lt 0 ]; then
            DELIVERED_COUNT=-1
          else
            DELIVERED_COUNT=$(( ACTIVE_COUNT - UNCOVERED_COUNT ))
          fi

          SEARCH_PHRASE="Daily letter send may be broken"
          ISSUE_TITLE="🚨 ${SEARCH_PHRASE}"
          PARTIAL_SEARCH_PHRASE="Daily letter send may be incomplete"
          PARTIAL_ISSUE_TITLE="⚠️ ${PARTIAL_SEARCH_PHRASE}"

          if [ "${DELIVERED_COUNT}" -lt 0 ]; then
            echo "ALERT: could not verify delivery (Supabase unreachable or returned something unparseable) -- treating as a failed check, not a silent pass."
            ALERT_BODY="The daily digest watchdog could not verify delivery: the Supabase query itself failed or returned an unparseable/non-array response (curl exit ${CURL_EXIT}) as of $(date -u +%Y-%m-%dT%H:%M:%SZ). This could mean Supabase is down, credentials rotated, or something else -- but it could also mean the send is broken and this check just can't see it either way. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            send_resend_alert "[alpha] Watchdog could not verify today's delivery" "${ALERT_BODY}"
            open_or_update_issue "${SEARCH_PHRASE}" "${ISSUE_TITLE}" "${ALERT_BODY}"
            exit 1
          fi

          if [ "${UNCOVERED_COUNT}" -gt 0 ]; then
            if [ "${DELIVERED_COUNT}" -eq 0 ]; then
              echo "ALERT: ${UNCOVERED_COUNT}/${ACTIVE_COUNT} active subscribers are uncovered since ${CUTOFF}, with no covered deliveries -- the daily send may be broken."
              ALERT_BODY="The daily digest watchdog found ${UNCOVERED_COUNT} uncovered subscribers out of ${ACTIVE_COUNT} active subscribers, with no covered deliveries since ${CUTOFF} (checked $(date -u +%Y-%m-%dT%H:%M:%SZ)). The app may be up and healthy while the actual send is broken -- this is exactly the failure mode from the 2026-08-05 outage (cron trigger silently unwired after a host migration). Check: did GitHub Actions' daily-send.yml run on schedule, are the SEND_* secrets it uses still present, and did that run actually complete (the Cloudflare Cron Trigger is deliberately disarmed as of 2026-08-05, so it's not the thing to check anymore). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              send_resend_alert "[alpha] No letters delivered in the last 20 hours" "${ALERT_BODY}"
              open_or_update_issue "${SEARCH_PHRASE}" "${ISSUE_TITLE}" "${ALERT_BODY}"
            else
              echo "ALERT: ${UNCOVERED_COUNT}/${ACTIVE_COUNT} active subscribers are still uncovered since ${CUTOFF} -- possible partial/crashed send."
              ALERT_BODY="The daily digest watchdog found ${UNCOVERED_COUNT} uncovered subscribers out of ${ACTIVE_COUNT} active subscribers since ${CUTOFF}. ${DELIVERED_COUNT} were covered (checked $(date -u +%Y-%m-%dT%H:%M:%SZ)). Some letters clearly went out, but every uncovered subscriber is a missed delivery. This can indicate a crashed or interrupted send, which alpha's own internal ops-alert also would not catch if the process died before the full per-subscriber loop finished. Check GitHub Actions' daily-send.yml run history for the last invocation. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              send_resend_alert "[alpha] Incomplete letter send (${DELIVERED_COUNT}/${ACTIVE_COUNT} covered)" "${ALERT_BODY}"
              open_or_update_issue "${PARTIAL_SEARCH_PHRASE}" "${PARTIAL_ISSUE_TITLE}" "${ALERT_BODY}"
            fi
            exit 1
          fi

          if [ "${UNCOVERED_COUNT}" -eq 0 ]; then
            echo "OK: 0/${ACTIVE_COUNT} active subscribers uncovered since ${CUTOFF} (${DELIVERED_COUNT} covered)."
            close_issue_if_open "${SEARCH_PHRASE}" "Resolved: zero active subscribers are uncovered since ${CUTOFF} (checked $(date -u +%Y-%m-%dT%H:%M:%SZ)). Closing automatically."
            close_issue_if_open "${PARTIAL_SEARCH_PHRASE}" "Resolved: zero active subscribers are uncovered since ${CUTOFF} (checked $(date -u +%Y-%m-%dT%H:%M:%SZ)). Closing automatically."
            exit 0
          fi

          echo "ALERT: delivery counts fell outside the expected integer shape."
          ALERT_BODY="The daily digest watchdog received unexpected delivery counts (active=${ACTIVE_COUNT}, uncovered=${UNCOVERED_COUNT}) as of $(date -u +%Y-%m-%dT%H:%M:%SZ). Treating this as an unverifiable delivery state. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          send_resend_alert "[alpha] Watchdog received invalid delivery counts" "${ALERT_BODY}"
          open_or_update_issue "${SEARCH_PHRASE}" "${ISSUE_TITLE}" "${ALERT_BODY}"
          exit 1

  check-resilience-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the SEND_* secrets the real send actually uses, not Cloudflare's
        env:
          RESEND_API_KEY: ${{ secrets.WATCHDOG_RESEND_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          # Read directly from THIS repo's secrets, not from a curl to the
          # Cloudflare Worker's /api/health. Repointed live 2026-08-05: the
          # daily send moved off Cloudflare onto GitHub Actions the same day
          # this job was written, and /api/health only ever reflected the
          # Cloudflare Worker's OWN env -- a completely separate SEND_*
          # secret set that could drift arbitrarily out of sync with zero
          # signal here. Confirmed live during the same audit: rotating a
          # Cloudflare secret without touching the matching SEND_* one would
          # leave this job reporting green forever while the real send's
          # fallback chain quietly lost a tier -- exactly the "second half
          # of the 2026-08-05 outage" class this job exists to catch, aimed
          # at the wrong host. The lists below deliberately mirror
          # scripts/verify-send-preflight.mjs: fixed hard requirements and
          # individually soft resilience tiers. Zero configured generators
          # enters backup-only delivery mode instead of blocking the send.
          SEND_CRON_SECRET: ${{ secrets.SEND_CRON_SECRET }}
          SEND_RESEND_API_KEY: ${{ secrets.SEND_RESEND_API_KEY }}
          SEND_RESEND_FROM: ${{ secrets.SEND_RESEND_FROM }}
          SEND_UNSUBSCRIBE_SECRET: ${{ secrets.SEND_UNSUBSCRIBE_SECRET }}
          SEND_SUPABASE_URL: ${{ secrets.SEND_SUPABASE_URL }}
          SEND_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SEND_SUPABASE_PUBLISHABLE_KEY }}
          SEND_SUPABASE_SECRET_KEY: ${{ secrets.SEND_SUPABASE_SECRET_KEY }}
          SEND_ANTHROPIC_API_KEY: ${{ secrets.SEND_ANTHROPIC_API_KEY }}
          SEND_GEMINI_API_KEY: ${{ secrets.SEND_GEMINI_API_KEY }}
          SEND_GROQ_API_KEY: ${{ secrets.SEND_GROQ_API_KEY }}
          SEND_DEEPSEEK_API_KEY: ${{ secrets.SEND_DEEPSEEK_API_KEY }}
          SEND_BRAVE_SEARCH_API_KEY: ${{ secrets.SEND_BRAVE_SEARCH_API_KEY }}
          SEND_YOU_API_KEY: ${{ secrets.SEND_YOU_API_KEY }}
          # Added when the ops-alert webhook fallback was wired 2026-08-05 --
          # resilience-tier like the provider/search keys above. sendOpsAlert() still works
          # via Resend without it, this only covers the case where Resend
          # itself is what's down. Worth watching for the same reason as any
          # other resilience-tier secret: it can silently go missing later
          # (a Discord webhook getting deleted/regenerated) with nothing else
          # here to notice.
          SEND_ALPHA_OPS_ALERT_WEBHOOK_URL: ${{ secrets.SEND_ALPHA_OPS_ALERT_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          # Same set +e requirement as check-delivery's job -- GitHub Actions
          # invokes this script's shell with -e regardless of what's declared
          # here, so a curl -f failure inside send_resend_alert would abort
          # before open_or_update_issue() ever ran. See the check-delivery
          # job's comment for the live incident that found this.
          set +e

          # Same three helpers as the delivery-check job -- duplicated
          # rather than shared because GitHub Actions has no lightweight
          # way to share a bash function across jobs without a separate
          # composite action, and this is the only other place that needs
          # them.
          close_issue_if_open() {
            local search_phrase="$1" resolution_note="$2" open_issue
            open_issue=$(gh issue list --repo "${GITHUB_REPOSITORY}" --search "\"${search_phrase}\" in:title" --state open --json number --jq '.[0].number // empty')
            if [ -n "${open_issue}" ]; then
              gh issue comment "${open_issue}" --repo "${GITHUB_REPOSITORY}" --body "${resolution_note}"
              gh issue close "${open_issue}" --repo "${GITHUB_REPOSITORY}"
            fi
          }

          open_or_update_issue() {
            local search_phrase="$1" issue_title="$2" body="$3" open_issue
            open_issue=$(gh issue list --repo "${GITHUB_REPOSITORY}" --search "\"${search_phrase}\" in:title" --state open --json number --jq '.[0].number // empty')
            if [ -n "${open_issue}" ]; then
              gh issue comment "${open_issue}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
            else
              gh issue create --repo "${GITHUB_REPOSITORY}" --title "${issue_title}" --body "${body}"
            fi
          }

          # Third duplicated helper -- same Resend payload/curl pattern as
          # check-delivery's send_resend_alert(), extracted here too rather
          # than left inline, so both jobs' alert-sending logic lives in the
          # same shape and a future payload change only needs finding via
          # "send_resend_alert" in both places, not one function + one
          # easy-to-miss inline block.
          send_resend_alert() {
            local subject="$1" body="$2" payload resend_exit
            # everyday.report, NOT avahealth.co (fixed live 2026-08-05):
            # the from-domain must be verified under the SAME Resend account
            # as the API key or every send 403s with "domain is not
            # verified" -- confirmed directly against Resend's API. This is
            # the actual, currently-verified domain for this key; using an
            # unrelated business's domain here was the root cause of every
            # watchdog alert email silently failing.
            payload=$(jq -n --arg from "alpha watchdog <alpha@everyday.report>" --arg to "youngalgy@gmail.com" \
              --arg subject "${subject}" --arg text "${body}" \
              '{from: $from, to: [$to], subject: $subject, text: $text}')
            curl -sS -f --max-time 15 --connect-timeout 5 -X POST 'https://api.resend.com/emails' \
              -H "Authorization: Bearer ${RESEND_API_KEY}" \
              -H 'Content-Type: application/json' \
              -d "${payload}" >/dev/null
            resend_exit=$?
            [ "${resend_exit}" -eq 0 ] || echo "WARNING: Resend alert call failed (curl exit ${resend_exit}) -- the GitHub Issue channel is still the source of truth."
          }

          SEARCH_PHRASE="SEND_* secret may be missing in GitHub"
          ISSUE_TITLE="⚠️ ${SEARCH_PHRASE}"

          # Direct presence check against THIS job's own env -- no network
          # call, nothing to fail to reach, nothing that can silently drift
          # from what it's supposed to be watching. These fixed hard and
          # soft lists mirror scripts/verify-send-preflight.mjs. Generator
          # keys are individually soft. With all of them absent, an already
          # usable persisted issue or bounded prior-issue backup remains.
          HARD_MISSING=""
          for name in SEND_CRON_SECRET SEND_RESEND_API_KEY SEND_RESEND_FROM SEND_UNSUBSCRIBE_SECRET SEND_SUPABASE_URL SEND_SUPABASE_PUBLISHABLE_KEY SEND_SUPABASE_SECRET_KEY; do
            val="${!name:-}"
            [ -n "${val}" ] || HARD_MISSING="${HARD_MISSING}${HARD_MISSING:+, }${name}"
          done

          GENERATOR_CONFIGURED=0
          for name in SEND_ANTHROPIC_API_KEY SEND_GEMINI_API_KEY SEND_GROQ_API_KEY SEND_DEEPSEEK_API_KEY; do
            val="${!name:-}"
            if [ -n "${val}" ]; then
              GENERATOR_CONFIGURED=$(( GENERATOR_CONFIGURED + 1 ))
            fi
          done
          SOFT_MISSING=""
          for name in SEND_ANTHROPIC_API_KEY SEND_GEMINI_API_KEY SEND_GROQ_API_KEY SEND_DEEPSEEK_API_KEY SEND_BRAVE_SEARCH_API_KEY SEND_YOU_API_KEY SEND_ALPHA_OPS_ALERT_WEBHOOK_URL; do
            val="${!name:-}"
            [ -n "${val}" ] || SOFT_MISSING="${SOFT_MISSING}${SOFT_MISSING:+, }${name}"
          done

          if [ -z "${HARD_MISSING}" ] && [ -z "${SOFT_MISSING}" ]; then
            echo "OK: all fixed hard SEND_* secrets present, ${GENERATOR_CONFIGURED} generators configured, and every resilience-tier secret present."
            close_issue_if_open "${SEARCH_PHRASE}" "Resolved: all SEND_* secrets present (checked $(date -u +%Y-%m-%dT%H:%M:%SZ)). Closing automatically."
            exit 0
          fi

          if [ -n "${HARD_MISSING}" ]; then
            echo "ALERT: hard send configuration missing: ${HARD_MISSING} -- the daily send cannot work at all."
            ALERT_BODY="This GitHub Actions send configuration is missing, and daily-send.yml's own pre-flight (scripts/verify-send-preflight.mjs) will fail the next scheduled run because of it: ${HARD_MISSING}. Fix: repo Settings -> Secrets and variables -> Actions, add the missing fixed SEND_* secret(s) (checked $(date -u +%Y-%m-%dT%H:%M:%SZ)). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            send_resend_alert "[alpha] HARD send configuration missing: ${HARD_MISSING}" "${ALERT_BODY}"
            open_or_update_issue "${SEARCH_PHRASE}" "${ISSUE_TITLE}" "${ALERT_BODY}"
            exit 1
          fi

          echo "ALERT: resilience-tier secret(s) missing: ${SOFT_MISSING}"
          ALERT_BODY="These resilience-tier GitHub Actions secrets are missing: ${SOFT_MISSING} (checked $(date -u +%Y-%m-%dT%H:%M:%SZ)). The primary send can still succeed through remaining providers, an already usable persisted issue, or a bounded prior-issue backup, so nothing else here would catch this reduced resilience -- this is exactly the second half of the 2026-08-05 outage. Fix: repo Settings -> Secrets and variables -> Actions, add the missing SEND_* secret(s). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          send_resend_alert "[alpha] Resilience-tier send secret(s) missing: ${SOFT_MISSING}" "${ALERT_BODY}"
          open_or_update_issue "${SEARCH_PHRASE}" "${ISSUE_TITLE}" "${ALERT_BODY}"
          exit 1

  heartbeat:
    # Optional third-party dead-man receiver. The no-cost Codex heartbeat
    # named "Alpha daily delivery monitor" checks live health and public run
    # state after the final retry. WATCHDOG_HEARTBEAT_PING_URL remains
    # supported as a second Alpha-only observer if one is added later.
    #
    # `needs:` still orders this job after both checks (so it reports on a
    # COMPLETE run, not one still in flight), but `if: always()` is load-
    # bearing: GitHub Actions' default `needs` behavior SKIPS a dependent job
    # when a dependency fails, and check-delivery legitimately exits 1 on a
    # genuine delivery problem (see its own `exit 1` after alerting, above).
    # Without always(), the heartbeat would silently stop pinging on exactly
    # the days there's a REAL problem to report -- the dead-man's-switch
    # exists to confirm the SCRIPT RAN, not that it found nothing wrong, and
    # a missing ping on a bad day would read as "the watchdog itself is
    # broken" on top of the real, already-alerted problem.
    needs: [check-delivery, check-resilience-secrets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This job only does an outbound curl to an optional heartbeat URL --
    # it never touches the GitHub API. The workflow-level `issues: write`
    # above exists for check-delivery/check-resilience-secrets' `gh issue`
    # calls; this job doesn't need it, so zero it out rather than inherit it.
    permissions: {}
    steps:
      - name: Ping optional external heartbeat receiver
        env:
          PING_URL: ${{ secrets.WATCHDOG_HEARTBEAT_PING_URL }}
        run: |
          if [ -z "${PING_URL}" ]; then
            echo "::notice:: WATCHDOG_HEARTBEAT_PING_URL is not configured. The Alpha Codex delivery monitor is the current independent observer."
            exit 0
          fi
          curl -fsS --max-time 10 --retry 3 "${PING_URL}"
