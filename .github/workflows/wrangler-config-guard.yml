name: Wrangler config guard

# PREVENTION, not detection -- the watchdog (letter-watchdog.yml) catches a
# failure within 20 hours after the fact; this stops the exact regression
# that caused the 2026-08-05 outage from ever landing on master unnoticed
# in the first place. Runs on every push, so a future change that silently
# drops the Cron Trigger config (a migration, a merge, a copy-paste from an
# older wrangler.jsonc) fails LOUDLY right there in CI, not silently in
# production days later.
#
# Reviewed and hardened 2026-08-05 after an adversarial multi-agent pass
# found real gaps in the first version: it only checked the crons array was
# non-empty (a wrong-but-present schedule would've passed silently), it
# never checked the WORKER_SELF_REFERENCE service binding scheduled() needs
# to actually do anything (dropping just that binding would leave crons and
# scheduled() both textually intact -- passing the old checks -- while the
# handler silently no-ops every single run), and its scheduled( grep would
# false-pass if the real handler were deleted but this file's own
# explanatory comment (which contains that literal substring) survived.
# This version fixes all three, plus tightens the JSONC parsing to match
# wrangler's own actual leniency instead of failing on things wrangler
# itself accepts (trailing commas, block comments).

on:
  push:
    branches: [master]
  workflow_dispatch: {}
  # No pull_request trigger: this repo has never used PRs (verified via `gh
  # api repos/YoungAlgy/alpha/pulls?state=all` -> [] and zero merge commits
  # in history) -- push:master already covers every commit that could
  # introduce this regression, so a pull_request trigger here is dead CI
  # surface with no repo-usage behind it. Re-add it if that ever changes.

permissions:
  contents: read # only need to read the repo to check config files

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA (v4's HEAD as of 2026-08-05), not the mutable
      # `v4` tag -- standard supply-chain hardening, cheap to do since this
      # is the only external action either workflow in this repo depends on.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify wrangler.jsonc has the real, expected Cron Trigger
        run: |
          node <<'EOF'
          const fs = require('fs');
          const raw = fs.readFileSync('wrangler.jsonc', 'utf8');

          // wrangler.jsonc is JSON-with-comments, and wrangler's OWN parser
          // (confirmed via wrangler-dist/cli.js) accepts line comments,
          // block comments, AND trailing commas. A naive `//`-strip-then-
          // JSON.parse would reject things wrangler itself accepts (a
          // trailing comma from routine editing, a future block comment) --
          // false-failing this guard for a config wrangler would happily
          // deploy. This does a proper string-aware strip instead of a
          // blind regex, so a `//` inside a string value (e.g. a route
          // pattern containing "https://") doesn't get corrupted either.
          function stripJsonComments(text) {
            let out = '';
            let inString = false;
            let inLineComment = false;
            let inBlockComment = false;
            for (let i = 0; i < text.length; i++) {
              const c = text[i];
              const next = text[i + 1];
              if (inLineComment) {
                if (c === '\n') { inLineComment = false; out += c; }
                continue;
              }
              if (inBlockComment) {
                if (c === '*' && next === '/') { inBlockComment = false; i++; }
                continue;
              }
              if (inString) {
                out += c;
                if (c === '\\') { out += next; i++; continue; }
                if (c === '"') inString = false;
                continue;
              }
              if (c === '"') { inString = true; out += c; continue; }
              if (c === '/' && next === '/') { inLineComment = true; i++; continue; }
              if (c === '/' && next === '*') { inBlockComment = true; i++; continue; }
              out += c;
            }
            return out;
          }

          let stripped = stripJsonComments(raw);
          stripped = stripped.replace(/,(\s*[}\]])/g, '$1'); // trailing commas

          let config;
          try {
            config = JSON.parse(stripped);
          } catch (e) {
            console.error('::error::wrangler.jsonc failed to parse as JSON(C): ' + e.message);
            process.exit(1);
          }

          // The single most likely way this whole guard gets silently defeated:
          // OpenNext's own default `main` is `.open-next/worker.js` (that's what
          // `opennextjs-cloudflare migrate`, every OpenNext doc, and the template
          // at node_modules/@opennextjs/cloudflare/templates/wrangler.jsonc all
          // ship), and that generated file's default export has NO scheduled()
          // handler -- confirmed by inspecting the real .open-next/worker.js
          // output. src/worker-entry.ts is a custom entry that wraps it AND adds
          // scheduled(). If `main` is ever reverted to the OpenNext default (a
          // re-init, a doc copy-paste, a "clean up the custom entry" edit),
          // every other check below still passes -- triggers.crons is untouched,
          // WORKER_SELF_REFERENCE is still bound, worker-entry.ts still exports
          // async scheduled() -- but none of that file is what's actually
          // deployed, so the 14:00 UTC cron fires into nothing and the CSRF
          // guard + Supabase session refresh in worker-entry.ts vanish too.
          const EXPECTED_MAIN = 'src/worker-entry.ts';
          if (config.main !== EXPECTED_MAIN) {
            console.error(
              `::error::wrangler.jsonc "main" is ${JSON.stringify(config.main)}, expected ` +
              `${JSON.stringify(EXPECTED_MAIN)}. This is the custom entry that implements ` +
              'scheduled(), the CSRF guard, and the Supabase session refresh -- every other ' +
              'check in this guard passes even when "main" points somewhere else, since they ' +
              'only inspect wrangler.jsonc and worker-entry.ts\'s own source, not what actually ' +
              'gets bundled and deployed.'
            );
            process.exit(1);
          }

          // EXPECTED_CRONS = [] DELIBERATELY, changed live 2026-08-05. The
          // daily send moved entirely off Cloudflare Workers: this account
          // is on the Workers FREE plan, whose fixed non-configurable CPU
          // time limit silently killed the one real cron run this trigger
          // ever got (0 errors logged, 0 issues created -- see wrangler.
          // jsonc's own comment on this block for the full incident).
          // GitHub Actions (.github/workflows/daily-send.yml) is the real,
          // working trigger now. This check's ORIGINAL purpose — catching
          // the cron silently vanishing without anyone deciding that on
          // purpose, which is exactly what caused the 2026-08-05 5-day
          // outage — still applies in reverse: if a cron entry reappears
          // here without EXPECTED_CRONS being updated in the same commit,
          // that is just as undocumented a drift as the original
          // disappearance was (e.g. a stray re-add racing the working
          // GitHub Actions trigger at the same instant, burning shared
          // free-tier API quota for a run that still cannot complete on
          // this plan). Update this array in the same commit as any
          // deliberate change either direction.
          const EXPECTED_CRONS = [];
          const crons = (config.triggers && config.triggers.crons) || [];
          if (JSON.stringify(crons) !== JSON.stringify(EXPECTED_CRONS)) {
            console.error(
              `::error::wrangler.jsonc triggers.crons is ${JSON.stringify(crons)}, expected ` +
              `${JSON.stringify(EXPECTED_CRONS)} (no Cloudflare cron -- the daily send runs on ` +
              'GitHub Actions instead, see wrangler.jsonc\'s own comment on this block). If ' +
              'you\'re intentionally re-arming this (e.g. after a Workers plan upgrade unlocks ' +
              'limits.cpu_ms), update EXPECTED_CRONS here in the same commit -- this check exists ' +
              'so a cron reappearing, or the schedule silently changing, can\'t slip through ' +
              'unnoticed in either direction.'
            );
            process.exit(1);
          }

          // The other half of the same dependency: scheduled() is a no-op
          // (silently -- see worker-entry.ts's guard clause) without this
          // binding. A future edit could drop just this array while leaving
          // crons and the scheduled() text both intact, passing every OTHER
          // check here while still breaking every real cron run.
          const services = config.services;
          const hasSelfRef = Array.isArray(services) && services.some((s) => s && s.binding === 'WORKER_SELF_REFERENCE');
          if (!hasSelfRef) {
            console.error(
              '::error::wrangler.jsonc is missing the WORKER_SELF_REFERENCE service binding -- ' +
              'scheduled() silently no-ops without it (see worker-entry.ts\'s guard clause), and ' +
              'Cloudflare records that no-op as a successful run. This is the same failure class ' +
              'as the missing cron trigger: config looks fine, nothing actually happens.'
            );
            process.exit(1);
          }

          // NOTE: no limits.cpu_ms check here (yet). Attempted 2026-08-05 as
          // part of investigating a live incident (0 issues sent, 0 errors
          // recorded, consistent with a silent CPU-time-exceeded isolate
          // kill), but this account is on Cloudflare's Free Workers plan,
          // which rejects `limits.cpu_ms` outright at deploy time -- it's
          // not configurable until upgraded to a paid plan. Re-add this
          // check (require limits.cpu_ms >= some floor) once that account
          // decision is made -- see wrangler.jsonc's own comment and
          // alpha_full_app_review_2026-08-05.md in Claude's memory.

          console.log('OK: wrangler.jsonc triggers.crons =', JSON.stringify(crons), '+ WORKER_SELF_REFERENCE binding present.');
          EOF

      - name: Verify worker-entry.ts still implements scheduled()
        run: |
          # Anchored to the real function signature, not a bare substring --
          # a plain `grep 'scheduled('` would still match this very file's
          # own explanatory comment ("...fires the scheduled() handler
          # directly...") even if the real `async scheduled(...)` below it
          # were deleted, silently false-passing the one check meant to
          # catch exactly that.
          if ! grep -qE 'async[[:space:]]+scheduled[[:space:]]*\(' src/worker-entry.ts; then
            echo "::error::src/worker-entry.ts no longer implements an async scheduled() handler -- wrangler.jsonc's Cron Trigger has nothing real to invoke."
            exit 1
          fi
          echo "OK: worker-entry.ts still implements async scheduled()."

  # alpha-drift-r19-01 (found+fixed 2026-08-07): the `guard` job above only
  # ever inspects wrangler.jsonc and grep's worker-entry.ts's own text -- it
  # never actually builds the app. daily-send.yml (this repo's only other
  # workflow that runs `npm run build`, at its own "Build" step) was, until
  # this job existed, the FIRST place a broken commit's TypeScript error, bad
  # import, or syntax error anywhere under app/ or lib/ would surface -- and
  # since master doesn't change between daily-send.yml's own 14:00/15:00/
  # 18:00 UTC same-day retries, all three would fail identically on the same
  # broken commit, producing a genuine full missed day. This job mirrors
  # daily-send.yml's own build step (same secrets, same env) so a broken
  # commit is caught within a minute or two of the push instead of at the
  # next scheduled send.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build (same command + secrets as daily-send.yml's own build step)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SEND_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SEND_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: https://alpha.everyday.report
        # Retries, not a single npm run build: this job's own first live run
        # (2026-08-07) failed with "Module not found: Can't resolve
        # '@vercel/turbopack-next/internal/font/google/font'" -- next/font/
        # google fetches font CSS from Google Fonts over the network at
        # build time, and a transient blip reaching it surfaces as a build
        # failure with no code changed at all (confirmed: a bare re-run of
        # the identical commit succeeded). daily-send.yml's OWN identical
        # build step has the same exposure but is cushioned by its
        # 14:00/15:00/18:00 UTC same-day retry windows; this job is
        # single-shot with no such cushion, so a false-positive CI failure
        # here would undermine exactly the "fails loudly, not silently"
        # trust this job exists to build. 3 attempts, 15s apart.
        run: |
          for attempt in 1 2 3; do
            if npm run build; then
              exit 0
            fi
            echo "::warning::Build attempt $attempt/3 failed (often a transient next/font/google fetch blip -- see this step's own comment). Retrying..."
            sleep 15
          done
          echo "::error::Build failed 3/3 attempts."
          exit 1
