name: Resend quota access check

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check one-send Resend quota contract
        env:
          RESEND_API_KEY: ${{ secrets.SEND_RESEND_API_KEY }}
          RESEND_FROM: '"alpha." <alpha@everyday.report>'
        run: node scripts/check-resend-quota-access.mjs
